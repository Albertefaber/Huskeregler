<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huskdet! — Vipperød Skole</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--surface:#fff;--surface2:#F0EDE8;--border:#E2DDD6;--text:#1A1816;--muted:#8A8480;--faint:#C8C4BF;--accent:#C4722A;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
.header{background:var(--text);padding:1rem 1.5rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.logo{font-family:'DM Serif Display',serif;font-size:20px;color:#F7F5F0}
.logo span{color:var(--accent);font-style:italic}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:320px}
.search{width:100%;padding:8px 12px 8px 34px;font-size:13px;border:none;border-radius:99px;background:rgba(255,255,255,.12);color:#F7F5F0;font-family:'DM Sans',sans-serif}
.search::placeholder{color:rgba(255,255,255,.4)}
.search:focus{outline:none;background:rgba(255,255,255,.18)}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);font-size:13px}
.add-btn-head{padding:7px 14px;background:var(--accent);color:#fff;border:none;border-radius:99px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.fag-tabs{display:flex;gap:6px;padding:.9rem 1.5rem;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:40}
.fag-tabs::-webkit-scrollbar{display:none}
.ftab{padding:6px 14px;font-size:13px;border-radius:99px;border:1.5px solid var(--border);background:none;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .15s;flex-shrink:0}
.ftab.active{font-weight:500;border-color:transparent}
.klasse-bar{display:flex;gap:6px;padding:.65rem 1.5rem;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--border)}
.klasse-bar::-webkit-scrollbar{display:none}
.ktab{padding:4px 11px;font-size:12px;border-radius:99px;border:1px solid var(--border);background:none;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .15s;flex-shrink:0}
.ktab.active{background:var(--text);color:#F7F5F0;border-color:var(--text)}
.content{padding:1.25rem 1.5rem;max-width:900px;margin:0 auto}
.sec-head{font-family:'DM Serif Display',serif;font-size:17px;margin:1.25rem 0 .65rem;display:flex;align-items:center;gap:7px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;margin-bottom:.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.9rem;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
.card-top{display:flex;align-items:flex-start;gap:9px}
.cicon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.chead{flex:1}
.ctitle{font-size:13px;font-weight:500;line-height:1.3}
.cmeta{font-size:10px;color:var(--muted);margin-top:2px}
.carr{font-size:11px;color:var(--faint);transition:transform .2s;margin-top:2px}
.card.open .carr{transform:rotate(180deg)}
.cbody{display:none;margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border)}
.card.open .cbody{display:block}
.ctekst{font-size:13px;line-height:1.6}
.cformel{background:var(--surface2);border-radius:8px;padding:.55rem .85rem;font-family:monospace;font-size:13px;margin:.45rem 0;line-height:1.5}
.ctip{font-size:12px;color:var(--muted);font-style:italic;margin-top:.45rem}
.cbadge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:99px;margin-top:.5rem}
.no-res{text-align:center;padding:2.5rem;color:var(--muted);font-size:14px}
/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.mbg.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:var(--r);padding:1.5rem;width:400px;max-width:95vw;transform:translateY(10px);transition:transform .2s;max-height:90vh;overflow-y:auto}
.mbg.open .modal{transform:translateY(0)}
.modal h3{font-family:'DM Serif Display',serif;font-size:19px;margin-bottom:1rem}
.fl{margin-bottom:10px}
.fl label{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.fl input,.fl select,.fl textarea{width:100%;padding:8px 10px;font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:none;border-color:var(--accent)}
.fl textarea{height:80px;resize:vertical}
.mact{display:flex;gap:7px;justify-content:flex-end;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}
.btn-c{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--muted)}
.btn-s{padding:7px 16px;border:none;border-radius:8px;background:var(--text);color:#F7F5F0;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500}
.btn-s:hover{background:var(--accent)}
.btn-d{padding:7px 11px;border:1px solid #F7EAEA;border-radius:8px;background:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;color:#7A2D2D;margin-right:auto}

.tl-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;padding:1.5rem}
.tl-overlay.open{display:block}
.tl-header{display:flex;align-items:center;gap:12px;margin-bottom:2rem}
.tl-title{font-family:'DM Serif Display',serif;font-size:24px;flex:1}
.tl-close{padding:7px 14px;border:1px solid var(--border);border-radius:99px;background:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--muted)}
.tl-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem}
.tl-ftab{padding:5px 12px;font-size:12px;border-radius:99px;border:1px solid var(--border);background:none;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--muted)}
.tl-ftab.active{background:var(--text);color:#F7F5F0;border-color:var(--text)}
.timeline{position:relative;padding-left:2rem}
.timeline::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--border)}
.tl-period{margin-bottom:2rem}
.tl-period-title{font-family:'DM Serif Display',serif;font-size:16px;color:var(--muted);margin-bottom:.75rem;padding-left:.5rem}
.tl-item{position:relative;margin-bottom:.75rem;padding-left:1.25rem}
.tl-item::before{content:'';position:absolute;left:-1.85rem;top:.4rem;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--border)}
.tl-item.highlight::before{background:var(--accent);border-color:var(--accent)}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem}
.tl-year{font-size:11px;font-weight:500;color:var(--accent);margin-bottom:3px}
.tl-event{font-size:13px;font-weight:500}
.tl-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.tl-tag{display:inline-flex;font-size:10px;padding:2px 7px;border-radius:99px;margin-top:5px}

</style>
</head>
<body>

<div class="header">
  <div class="logo">Husk<span>det!</span></div>
  <div class="search-wrap">
    <span class="si">🔍</span>
    <input class="search" type="text" placeholder="Søg regel, begreb..." id="search" oninput="render()">
  </div>
  <button class="add-btn-head" onclick="toggleTidslinje()" id="tl-btn">📅 Tidslinje</button>
  <button class="add-btn-head" onclick="openModal()">+ Tilføj regel</button>
</div>

<div class="fag-tabs" id="fag-tabs"></div>
<div class="klasse-bar" id="klasse-tabs"></div>
<div class="content" id="content"></div>

<div class="mbg" id="mbg" onclick="closeBg(event)">
  <div class="modal">
    <h3 id="mtitle">Tilføj regel</h3>
    <div class="fl"><label>Fag</label>
      <select id="f-fag">
        <option value="mat">Matematik</option>
        <option value="his">Historie</option>
        <option value="kri">Kristendom</option>
        <option value="nat">Natur/teknologi</option>
        <option value="idr">Idræt</option>
      </select>
    </div>
    <div class="fl"><label>Klassetrin</label>
      <select id="f-kl">
        <option>1.-2. kl.</option>
        <option>3.-4. kl.</option>
        <option>5.-6. kl.</option>
        <option>7.-9. kl.</option>
      </select>
    </div>
    <div class="fl"><label>Type</label>
      <select id="f-type">
        <option value="regel">Regel</option>
        <option value="formel">Formel</option>
        <option value="begreb">Begreb</option>
        <option value="glose">Glose</option>
      </select>
    </div>
    <div class="fl"><label>Titel</label><input type="text" id="f-titel" placeholder="fx Areal af trekant"></div>
    <div class="fl"><label>Ikon (emoji)</label><input type="text" id="f-icon" placeholder="fx 📐" maxlength="4"></div>
    <div class="fl"><label>Forklaring</label><textarea id="f-tekst" placeholder="Forklar reglen med dine egne ord..."></textarea></div>
    <div class="fl"><label>Formel / eksempel</label><input type="text" id="f-formel" placeholder="fx A = l × b"></div>
    <div class="fl"><label>Husk-tip</label><input type="text" id="f-tip" placeholder="fx Husk: længde gange bredde"></div>
    <div class="mact">
      <button class="btn-d" id="btn-del" style="display:none" onclick="delCard()">Slet</button>
      <button class="btn-c" onclick="closeModal()">Annuller</button>
      <button class="btn-s" onclick="saveCard()">Gem</button>
    </div>
  </div>
</div>

<script>
const FAGER=[
  {id:'alle',label:'Alle fag',emoji:'📚',color:'#534AB7',bg:'#EEEDFE'},
  {id:'mat', label:'Matematik',emoji:'🔢',color:'#534AB7',bg:'#EEEDFE'},
  {id:'his', label:'Historie',emoji:'🏛️',color:'#BA7517',bg:'#FAEEDA'},
  {id:'kri', label:'Kristendom',emoji:'✝️',color:'#0F6E56',bg:'#E1F5EE'},
  {id:'nat', label:'Natur/teknologi',emoji:'🌱',color:'#3B6D11',bg:'#EAF3DE'},
  {id:'idr', label:'Idræt',emoji:'⚽',color:'#993C1D',bg:'#FAECE7'},
];
const KL=['Alle','1.-2. kl.','3.-4. kl.','5.-6. kl.','7.-9. kl.'];

const BUILT_IN=[
  // ══ MATEMATIK 1.-2. kl. ══
  {id:'b1',fag:'mat',klasse:'1.-2. kl.',type:'regel',icon:'🔢',titel:'Talsystemet 0-100',tekst:'Vi bruger cifrene 0-9. Tallene er bygget op af tiere og enere. 34 = 3 tiere og 4 enere.',tip:'Husk: tegn tallet som tæller og enere med streger'},
  {id:'b2',fag:'mat',klasse:'1.-2. kl.',type:'regel',icon:'➕',titel:'Plus og minus',tekst:'Plus betyder vi lægger sammen — vi får mere. Minus betyder vi tager fra — vi får mindre.',formel:'3 + 4 = 7   |   7 - 4 = 3',tip:'Brug fingre, tallinje eller konkrete ting'},
  {id:'b3',fag:'mat',klasse:'1.-2. kl.',type:'regel',icon:'⚖️',titel:'Lige og ulige tal',tekst:'Lige tal kan deles i to lige store dele. Ulige tal kan ikke.',formel:'Lige: 2, 4, 6, 8, 10...   Ulige: 1, 3, 5, 7, 9...',tip:'Kig på det sidste ciffer — er det 0,2,4,6,8 er det lige'},
  {id:'b4',fag:'mat',klasse:'1.-2. kl.',type:'begreb',icon:'📏',titel:'Måling og længde',tekst:'Vi måler med cm (centimeter) og m (meter). 100 cm = 1 m. Vi bruger lineal til at måle.',tip:'Husk at starte ved 0 på linealen'},

  // ══ MATEMATIK 3.-4. kl. ══
  {id:'b5',fag:'mat',klasse:'3.-4. kl.',type:'formel',icon:'✖️',titel:'Gange og division',tekst:'Gange er den hurtige måde at lægge det samme tal sammen mange gange. Division er det modsatte af gange.',formel:'4 × 3 = 12   |   12 ÷ 3 = 4',tip:'Husk gangetabellen — øv 2, 5 og 10-tabellen først'},
  {id:'b6',fag:'mat',klasse:'3.-4. kl.',type:'formel',icon:'📐',titel:'Areal af rektangel',tekst:'Areal er pladsens størrelse inden i en figur. Vi måler i cm² (kvadratcentimeter).',formel:'Areal = længde × bredde',tip:'Eks: 4 cm × 3 cm = 12 cm²'},
  {id:'b7',fag:'mat',klasse:'3.-4. kl.',type:'formel',icon:'📏',titel:'Omkreds',tekst:'Omkreds er den samlede længde rundt om en figur. Vi lægger alle sider sammen.',formel:'Omkreds = side1 + side2 + side3...',tip:'Gå rundt om figuren med fingeren og læg siderne sammen'},
  {id:'b8',fag:'mat',klasse:'3.-4. kl.',type:'regel',icon:'🔢',titel:'Store tal og størrelsesorden',tekst:'Tusinde = 1.000. Ti-tusinde = 10.000. Hundrede-tusinde = 100.000. Million = 1.000.000.',formel:'1.234 = 1 tusinde, 2 hundreder, 3 tiere, 4 enere',tip:'Tæl cifre fra højre: enere, tiere, hundreder, tusinder'},
  {id:'b9',fag:'mat',klasse:'3.-4. kl.',type:'begreb',icon:'½',titel:'Brøker',tekst:'En brøk viser en del af en helhed. Tælleren (øverst) viser hvor mange dele. Nævneren (nederst) viser hvor mange dele i alt.',formel:'¾ = 3 ud af 4 dele',tip:'Pizza-trick: nævner = antal stykker, tæller = dit stykker'},

  // ══ MATEMATIK 5.-6. kl. ══
  {id:'b10',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'💯',titel:'Procent',tekst:'Procent betyder "ud af 100". Bruges til at sammenligne og beregne andele.',formel:'Procent = del ÷ hele × 100\nDel = hele × procent ÷ 100',tip:'50% = halvdelen, 25% = kvart, 10% = tiendedel'},
  {id:'b11',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'📐',titel:'Areal af trekant',tekst:'En trekant fylder det halve af et rektangel med samme grundlinje og højde.',formel:'Areal = grundlinje × højde ÷ 2',tip:'Eks: g=6, h=4 → (6×4)÷2 = 12 cm²'},
  {id:'b12',fag:'mat',klasse:'5.-6. kl.',type:'begreb',icon:'📊',titel:'Koordinatsystem',tekst:'To akser: x-aksen (vandret) og y-aksen (lodret). Et punkt skrives (x,y) — x altid først.',formel:'(3, 5) = 3 til højre, 5 op',tip:'Husk: "Gå frem, så op" — som i gaden og etagen'},
  {id:'b13',fag:'mat',klasse:'5.-6. kl.',type:'regel',icon:'⚖️',titel:'Ligninger',tekst:'En ligning er som en vægt — begge sider skal være lige. Det du gør på den ene side, gør du på den anden.',formel:'x + 5 = 12  →  x = 12 − 5  →  x = 7',tip:'Isolér x: flyt alt andet til den anden side med modsat tegn'},
  {id:'b14',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'📏',titel:'Målestoksforhold',tekst:'Et målestoksforhold viser forholdet mellem kort/tegning og virkelighed.',formel:'1:100 betyder 1 cm = 100 cm i virkeligheden',tip:'Eks: 1:50.000 → 1 cm på kortet = 500 m i virkeligheden'},
  {id:'b15',fag:'mat',klasse:'5.-6. kl.',type:'begreb',icon:'🔢',titel:'Negative tal',tekst:'Negative tal er tal under nul. Vi skriver dem med minus foran. Bruges bl.a. til temperatur og gæld.',formel:'−5 er 5 under nul   |   −3 + 5 = 2',tip:'Tallinje: negative tal er til venstre for 0'},

  // ══ MATEMATIK 7.-9. kl. ══
  {id:'b16',fag:'mat',klasse:'7.-9. kl.',type:'formel',icon:'📐',titel:'Pythagoras',tekst:'I en retvinklet trekant er kvadratet på hypotenusen lig summen af kvadraterne på de to kateter. Hypotenusen er den længste side (over for den rette vinkel).',formel:'a² + b² = c²',tip:'Eks: a=3, b=4 → c²=9+16=25 → c=5'},
  {id:'b17',fag:'mat',klasse:'7.-9. kl.',type:'formel',icon:'⭕',titel:'Cirklens areal og omkreds',tekst:'π (pi) ≈ 3,14159. r = radius (halvdelen af diameter). d = diameter.',formel:'Areal = π × r²\nOmkreds = 2 × π × r = π × d',tip:'Eks: r=5 → Areal = 3,14 × 25 ≈ 78,5 cm²'},
  {id:'b18',fag:'mat',klasse:'7.-9. kl.',type:'formel',icon:'💯',titel:'Procentregning avanceret',tekst:'Tre typer: find procenten, find delen, find det hele. Procentvis ændring viser vækst eller fald.',formel:'Procentvis ændring = (ny−gammel) ÷ gammel × 100',tip:'Stigning på 20%: gang med 1,2. Fald på 20%: gang med 0,8'},
  {id:'b19',fag:'mat',klasse:'7.-9. kl.',type:'regel',icon:'🔣',titel:'Potenser og rødder',tekst:'En potens er et tal ganget med sig selv. En rod er det modsatte af en potens.',formel:'2³ = 2×2×2 = 8   |   √25 = 5',tip:'2⁰ = 1 altid! Negativt eksponent = brøk: 2⁻¹ = ½'},
  {id:'b20',fag:'mat',klasse:'7.-9. kl.',type:'regel',icon:'📊',titel:'Statistik — centrale begreber',tekst:'Middelværdi = gennemsnit. Median = midterste tal. Typetal = det hyppigste tal.',formel:'Middelværdi = sum af alle tal ÷ antal tal',tip:'Eks: 2,4,4,6,8 → middelværdi=(2+4+4+6+8)÷5=4,8, median=4'},

  // ══ HISTORIE 3.-4. kl. ══
  {id:'b21',fag:'his',klasse:'3.-4. kl.',type:'begreb',icon:'📜',titel:'Hvad er historie?',tekst:'Historie er læren om fortiden. Vi bruger kilder til at finde ud af hvad der skete. En historiker undersøger og fortolker fortiden.',tip:'Kilde = alt der kan fortælle os om fortiden'},
  {id:'b22',fag:'his',klasse:'3.-4. kl.',type:'begreb',icon:'⏳',titel:'Tidslinjen og årstal',tekst:'En tidslinje viser hvornår ting skete. f.Kr. tæller baglæns (jo større tal, jo længere tilbage). e.Kr. tæller fremad.',formel:'f.Kr. = før Kristus   |   e.Kr. = efter Kristus',tip:'År 0 er Jesu fødsel. 500 f.Kr. er 500 år FØR Jesus'},
  {id:'b23',fag:'his',klasse:'3.-4. kl.',type:'begreb',icon:'🏰',titel:'Vikingetiden',tekst:'Vikingerne levede ca. 793-1066 e.Kr. De sejlede, handlede, opdagede nye lande og plyndrede.',formel:'793: Første vikingeangreb (Lindisfarne)\n985: Erikr Røde opdager Grønland',tip:'Vikingerne havde også byer, markeder og lovting — ikke kun krig'},

  // ══ HISTORIE 5.-6. kl. ══
  {id:'b24',fag:'his',klasse:'5.-6. kl.',type:'begreb',icon:'📚',titel:'Primær og sekundær kilde',tekst:'Primær kilde: lavet DA det skete (dagbog, brev, foto, genstand). Sekundær kilde: lavet BAGEFTER om det der skete (lærebog, dokumentar).',tip:'Primær = fra dengang. Begge er vigtige — men pas på med tolkning!'},
  {id:'b25',fag:'his',klasse:'5.-6. kl.',type:'begreb',icon:'🌍',titel:'2. Verdenskrig — kronologi',tekst:'Den største krig i historien. Nazityskland under Hitler startede krigen. 6 mio. jøder og millioner af andre blev dræbt.',formel:'1939: Krigen starter\n1940: Danmark besættes (9. april)\n1943: Jøderne forsøges deporteret\n1945: Krigen slutter (5. maj)',tip:'Danmark var besat i 5 år — husk datoerne 9/4 1940 og 5/5 1945'},
  {id:'b26',fag:'his',klasse:'5.-6. kl.',type:'begreb',icon:'📢',titel:'Propaganda',tekst:'Propaganda er information der bevidst skal påvirke folk til at mene eller gøre noget bestemt. Bruges ofte i krig og politik.',tip:'Spørg altid: Hvem har lavet det? Hvad vil de have mig til at tro? Er det sandt?'},
  {id:'b27',fag:'his',klasse:'5.-6. kl.',type:'begreb',icon:'✊',titel:'Modstandsbevægelsen',tekst:'Danskere der kæmpede mod den tyske besættelse. Sabotage, illegale aviser, hjælp til jøder.',tip:'Ca. 7.000 danske jøder blev reddet til Sverige i oktober 1943'},
  {id:'b28',fag:'his',klasse:'5.-6. kl.',type:'begreb',icon:'👑',titel:'Enevælde og demokrati',tekst:'Enevælde: én person (kongen) bestemmer alt. Demokrati: folket bestemmer via valg og folketing.',formel:'1660: Enevælde indføres i Danmark\n1849: Demokrati (Grundloven)',tip:'Grundloven = Danmarks øverste lov, vedtaget 5. juni 1849'},

  // ══ HISTORIE 7.-9. kl. ══
  {id:'b29',fag:'his',klasse:'7.-9. kl.',type:'begreb',icon:'🗺️',titel:'Imperialisme og kolonialisme',tekst:'Imperialisme: stærke lande erobrer svagere lande for at få ressourcer, magt og markeder. Europa koloniserede Afrika, Asien og Amerika.',formel:'1800-tallet: Europas storhedstid som kolonimagt',tip:'Koloni = det besatte land. Moderland = det der besætter'},
  {id:'b30',fag:'his',klasse:'7.-9. kl.',type:'begreb',icon:'⚔️',titel:'1. Verdenskrig',tekst:'Krigen der startede med mordet på Frans Ferdinand. Gravetekrig, giftgas, millioner døde.',formel:'1914-1918\nTripleententen: Frankrig, UK, Rusland\nTriplealliancen: Tyskland, Østrig, Italien',tip:'Danmark var neutral — men sendte mad til begge sider'},
  {id:'b31',fag:'his',klasse:'7.-9. kl.',type:'begreb',icon:'❄️',titel:'Den kolde krig',tekst:'USA (kapitalisme/demokrati) mod Sovjetunionen (kommunisme). Ikke direkte krig men oprustning, propaganda og stedfortræderkrige.',formel:'1947-1991\nNATO = Vesten   |   Warszawapagten = Østen',tip:'Berlinmuren (1961-1989) var det stærkeste symbol på den kolde krig'},
  {id:'b32',fag:'his',klasse:'7.-9. kl.',type:'begreb',icon:'⚙️',titel:'Den industrielle revolution',tekst:'Fra håndværk til maskiner og fabrikker. Startede i England ca. 1750. Ændrede alt: transport, arbejde, byer, befolkning.',formel:'Ca. 1750-1900\nDampmaskine → fabrikker → jernbane → urbanisering',tip:'Danmark industrialiseres ca. 1870-1914'},

  // ══ KRISTENDOM 1.-2. kl. ══
  {id:'b33',fag:'kri',klasse:'1.-2. kl.',type:'begreb',icon:'📖',titel:'Hvad er en myte?',tekst:'En myte er en gammel fortælling der prøver at forklare verden og livet. Myter er ikke fakta — de er historier med en dybere mening.',tip:'Nordiske myter, bibelhistorier og folkeeventyr er alle myter'},
  {id:'b34',fag:'kri',klasse:'1.-2. kl.',type:'begreb',icon:'✝️',titel:'Jesus — hvem er han?',tekst:'Jesus er den centrale person i kristendommen. Han levede for ca. 2000 år siden i Israel. Kristne tror han er Guds søn.',tip:'Kristendom = at følge Kristus (et andet ord for Jesus)'},

  // ══ KRISTENDOM 3.-4. kl. ══
  {id:'b35',fag:'kri',klasse:'3.-4. kl.',type:'begreb',icon:'📚',titel:'Bibelen',tekst:'Den kristne hellige bog. Delt i to: Det Gamle Testamente (GT) og Det Nye Testamente (NT). GT er også jødernes hellige skrift.',formel:'GT: 39 bøger, jødernes skrifter\nNT: 27 bøger, om Jesus og de første kristne',tip:'Evangelierne (Matthæus, Markus, Lukas, Johannes) handler om Jesu liv'},
  {id:'b36',fag:'kri',klasse:'3.-4. kl.',type:'begreb',icon:'🌍',titel:'Verdens fem store religioner',tekst:'Kristendom, Islam, Jødedom, Hinduisme og Buddhisme er de fem store verdensreligioner.',formel:'Kristendom: 2,4 mia.\nIslam: 1,9 mia.\nHinduisme: 1,2 mia.\nBuddhisme: 500 mio.\nJødedom: 15 mio.',tip:'De tre første (kristendom, islam, jødedom) er abrahamitiske religioner'},
  {id:'b37',fag:'kri',klasse:'3.-4. kl.',type:'begreb',icon:'🕍',titel:'Jødedom — grundbegreber',tekst:'Torah = jødernes hellige bog (de 5 Mosebøger). Synagoge = gudshus. Rabbi = religiøs leder. Sabbat = hviledagen (fredag aften til lørdag aften).',tip:'Jødedommen er en af verdens ældste religioner — over 3500 år gammel'},

  // ══ KRISTENDOM 5.-6. kl. ══
  {id:'b38',fag:'kri',klasse:'5.-6. kl.',type:'begreb',icon:'☪️',titel:'Islam — grundbegreber',tekst:'Koranen = islams hellige bog. Moske = gudshus. Imam = leder. Allah = arabisk for Gud. Muhammed = islams profet (født 570 e.Kr.).',formel:'De 5 søjler:\n1. Trosbekendelse\n2. Bøn (5 gange dagligt)\n3. Almisse (zakat)\n4. Faste (ramadan)\n5. Pilgrimsrejse (hajj)',tip:'Ramadan = islams fastemåned. Eid = fejring efter ramadan'},
  {id:'b39',fag:'kri',klasse:'5.-6. kl.',type:'begreb',icon:'🕉️',titel:'Hinduisme — grundbegreber',tekst:'Verdens ældste religion. Mange guder men én overordnet kraft (Brahman). Tror på karma og reinkarnation.',formel:'Karma = dine handlingers konsekvenser\nReinkarnation = sjælen genfødes\nMoksha = befrielse fra genfødselshjulet',tip:'Hinduisme opstod i Indien for over 4000 år siden'},
  {id:'b40',fag:'kri',klasse:'5.-6. kl.',type:'begreb',icon:'☸️',titel:'Buddhisme — grundbegreber',tekst:'Grundlagt af Siddhartha Gautama (Buddha) ca. 500 f.Kr. i Indien. Målet er at nå nirvana — befrielse fra lidelse.',formel:'De 4 ædle sandheder:\n1. Livet er lidelse\n2. Lidelse opstår af begær\n3. Lidelse kan ophøre\n4. Der er en vej ud (den 8-foldige vej)',tip:'Buddha betyder "den oplyste". Meditation er central i buddhisme'},
  {id:'b41',fag:'kri',klasse:'5.-6. kl.',type:'begreb',icon:'✝️',titel:'Kristendommens tre grene',tekst:'Kristendommen er delt i tre hovedgrene: Katolicisme (pave i Rom), Protestantisme (Luther, 1517) og Ortodoksi (Østkirken).',formel:'1054: Skismaet (ortodoks og katolsk deles)\n1517: Reformationen (Luther, protestantisme)',tip:'Danmark er protestantisk — luthersk kirke'},

  // ══ KRISTENDOM 7.-9. kl. ══
  {id:'b42',fag:'kri',klasse:'7.-9. kl.',type:'begreb',icon:'⚖️',titel:'Etik og moral',tekst:'Etik = læren om hvad der er rigtigt og forkert. Moral = de regler og værdier vi lever efter. Etik spørger HVORFOR noget er rigtigt.',formel:'Pligtetik: følg reglerne (Kant)\nKonsekvensetik: se på resultatet (Mill)\nDydsetik: vær et godt menneske (Aristoteles)',tip:'Den gyldne regel: Behandl andre som du selv vil behandles'},
  {id:'b43',fag:'kri',klasse:'7.-9. kl.',type:'begreb',icon:'🌍',titel:'Religiøs mangfoldighed',tekst:'Danmark er et multikulturelt samfund med mange religioner. Religionsfrihed er en grundlovsret.',tip:'Pas på stereotyper — der er stor variation inden for alle religioner'},

  // ══ NATUR/TEKNOLOGI 1.-2. kl. ══
  {id:'b44',fag:'nat',klasse:'1.-2. kl.',type:'regel',icon:'🌱',titel:'Levende og ikke-levende',tekst:'Levende ting: vokser, spiser, ånder, formerer sig. Ikke-levende ting: kan ikke noget af det.',tip:'Blomst = levende. Sten = ikke levende. En bil kan bevæge sig men er ikke levende'},
  {id:'b45',fag:'nat',klasse:'1.-2. kl.',type:'begreb',icon:'🌦️',titel:'Vejret og årstiderne',tekst:'Vejret ændrer sig hele tiden. Der er fire årstider: forår, sommer, efterår, vinter. Årstiderne opstår fordi Jorden er vippet og drejer om Solen.',tip:'Husk: Jordens hældning giver årstider — ikke afstanden til Solen'},

  // ══ NATUR/TEKNOLOGI 3.-4. kl. ══
  {id:'b46',fag:'nat',klasse:'3.-4. kl.',type:'begreb',icon:'🔗',titel:'Fødekæden',tekst:'Viser hvem der spiser hvem. Starter altid med planter (producenter). Går via planteædere til kødædere.',formel:'Sol → Plante → Mus → Ræv → Ørn',tip:'Producent = plante. Konsument = dyr. Nedbryder = svamp/bakterie'},
  {id:'b47',fag:'nat',klasse:'3.-4. kl.',type:'begreb',icon:'💧',titel:'Vandets kredsløb',tekst:'Vand fordamper (fra hav, søer), stiger op, afkøles og danner skyer, falder som nedbør og løber tilbage.',formel:'Fordampning → Kondensation → Nedbør → Afstrømning',tip:'Vand skifter form men forsvinder aldrig — det er altid det samme vand'},
  {id:'b48',fag:'nat',klasse:'3.-4. kl.',type:'begreb',icon:'🌍',titel:'Jordens indre og ydre',tekst:'Jordens lag: indre kerne (fast jern), ydre kerne (flydende), kappe (semiflydende), skorpe (det vi går på).',tip:'Pladetektonik: jordskorpen er delt i plader der bevæger sig langsomt'},

  // ══ NATUR/TEKNOLOGI 5.-6. kl. ══
  {id:'b49',fag:'nat',klasse:'5.-6. kl.',type:'begreb',icon:'🔬',titel:'Celler — grundenheden',tekst:'Alt levende er bygget af celler. Planteceller har cellevæg og kloroplaster. Dyre- og menneskeceller har det ikke.',formel:'Cellekerne = styrer cellen\nMitokondrie = producerer energi\nKloroplast = fotosyntese (kun planter)',tip:'Menneskekroppen har ca. 37 billioner celler'},
  {id:'b50',fag:'nat',klasse:'5.-6. kl.',type:'formel',icon:'☀️',titel:'Fotosyntese',tekst:'Planter bruger sollys, vand og kuldioxid til at lave sukker (mad) og ilt. Det er grundlaget for alt liv.',formel:'CO₂ + H₂O + lys → glukose + O₂\n(kuldioxid + vand + lys → sukker + ilt)',tip:'Fotosyntese sker i kloroplasterne ved hjælp af klorofyl (det grønne)'},
  {id:'b51',fag:'nat',klasse:'5.-6. kl.',type:'begreb',icon:'🧲',titel:'Elektricitet og magnetisme',tekst:'Elektrisk strøm er bevægelse af elektroner. Magneter har nord- og sydpol. Modpoler tiltrækker, ens poler frastøder.',formel:'Strøm (A) = Spænding (V) ÷ Modstand (Ω)',tip:'Jordens magnetfelt beskytter os mod solstorm'},
  {id:'b52',fag:'nat',klasse:'5.-6. kl.',type:'begreb',icon:'🌿',titel:'Fotosyntese vs. respiration',tekst:'Fotosyntese: planter laver mad (bruger CO₂, giver O₂). Respiration: alle levende ting forbrænder mad (bruger O₂, giver CO₂).',tip:'Planter laver BEGGE dele — men fotosyntesen er stærkere i dagslys'},

  // ══ NATUR/TEKNOLOGI 7.-9. kl. ══
  {id:'b53',fag:'nat',klasse:'7.-9. kl.',type:'formel',icon:'⚡',titel:'Newtons love',tekst:'Newton beskrev bevægelse med tre love. De gælder overalt i universet.',formel:'1. lov: Hvile/bevægelse fortsætter uden kraft\n2. lov: F = m × a\n3. lov: Aktion = reaktion',tip:'F=ma: jo mere masse, jo mere kraft skal til for samme acceleration'},
  {id:'b54',fag:'nat',klasse:'7.-9. kl.',type:'begreb',icon:'⚡',titel:'Energiformer og -omdannelse',tekst:'Energi kan ikke skabes eller ødelægges — kun omdannes. Energibevarelsesprincippet.',formel:'Mekanisk → Varme → Lyd → Lys → Elektrisk → Kemisk',tip:'Effektivitet = nyttig energi ÷ tilført energi × 100%'},

  // ══ IDRÆT 1.-2. kl. ══
  {id:'b55',fag:'idr',klasse:'1.-2. kl.',type:'regel',icon:'🤝',titel:'Fair play',tekst:'Fair play betyder at spille ordentligt, respektere hinanden og reglerne. Vi hjælper hinanden og accepterer at tabe.',tip:'Det er ikke sjovt at vinde ved at snyde'},
  {id:'b56',fag:'idr',klasse:'1.-2. kl.',type:'regel',icon:'🏃',titel:'Grundbevægelser',tekst:'De grundlæggende bevægelser: gå, løbe, hoppe, kaste, gribe, sparke, rulle og klatre. De er grundlaget for al idræt.',tip:'Øv alle bevægelser — også dem du ikke er bedst til'},

  // ══ IDRÆT 3.-4. kl. ══
  {id:'b57',fag:'idr',klasse:'3.-4. kl.',type:'regel',icon:'🏋️',titel:'Opvarmning og nedkøling',tekst:'Opvarmning forbereder kroppen: øger blodgennemstrømning, varmer muskler, forebygger skader. Nedkøling: sænker pulsen, strækker muskler.',formel:'Opvarmning: 5-10 min. let løb + dynamiske øvelser\nNedkøling: 5 min. let aktivitet + statisk stræk',tip:'Aldrig springe opvarmning over — det er der skader sker'},
  {id:'b58',fag:'idr',klasse:'3.-4. kl.',type:'begreb',icon:'❤️',titel:'Puls og kondition',tekst:'Pulsen er hjerteslagene per minut. God kondition = hjertet er effektivt og pulsen falder hurtigt efter aktivitet.',formel:'Maxpuls ≈ 220 − din alder\nTrainingszone: 60-80% af maxpuls',tip:'Hvilepuls for børn: ca. 70-100 slag/min.'},

  // ══ IDRÆT 5.-6. kl. ══
  {id:'b59',fag:'idr',klasse:'5.-6. kl.',type:'regel',icon:'🤾',titel:'Håndboldregler',tekst:'3 sekunders regel: max 3 sek. med bolden. 3 skridt: max 3 skridt. Mål: kun målvogter i eget felt (6 m).',formel:'Mål: 3×2 m\n7-meterstraffekast: ved bevidst fejl i mål\nKasterne: 9-meterstreg er fri zone',tip:'Spilletid: 2×30 min. i senior. Kortere for børn'},
  {id:'b60',fag:'idr',klasse:'5.-6. kl.',type:'begreb',icon:'💪',titel:'Musklerne',tekst:'Muskler arbejder i par — antagonister. Den ene trækker sig sammen (agonist), den anden strækker sig (antagonist).',formel:'Biceps (bøjer albuen) ↔ Triceps (strækker albuen)\nQuadriceps (strækker knæet) ↔ Hasemusklerne (bøjer)',tip:'Muskler vokser ved træning + hvile + protein'},
  {id:'b61',fag:'idr',klasse:'5.-6. kl.',type:'regel',icon:'⚽',titel:'Fodboldregler — grundlæggende',tekst:'11 spillere per hold. Offside: angriber er foran næstsidste forsvarer når bolden spilles. Gult kort = advarsel. Rødt = udvisning.',formel:'Spilletid: 2×45 min. (senior)\nStraffe: 11 meter fra mål',tip:'Offside gælder KUN ved angreb — ikke ved indkast og hjørnesparkene'},

  // ══ IDRÆT 7.-9. kl. ══
  {id:'b62',fag:'idr',klasse:'7.-9. kl.',type:'begreb',icon:'🏋️',titel:'Aerob og anaerob træning',tekst:'Aerob: med ilt, moderat intensitet, kan holdes længe. Anaerob: uden ilt, høj intensitet, kort varighed.',formel:'Aerob: løb, cykling, svømning (>2 min.)\nAnaerob: sprint, styrketræning (<2 min.)',tip:'Aerob = fedtforbrænding. Anaerob = muskelopbygning'},
  {id:'b63',fag:'idr',klasse:'7.-9. kl.',type:'begreb',icon:'🥗',titel:'Kost og ernæring til sport',tekst:'Kulhydrater giver hurtig energi. Protein bygger og reparerer muskler. Fedt er brændstof ved lang, moderat træning.',formel:'Kulhydrat: brød, pasta, ris, frugt\nProtein: kød, æg, mejeri, bønner, nødder\nFedt: olie, nødder, avocado',tip:'Spis 2-3 timer før træning. Drik vand hele dagen'},
  {id:'b64',fag:'idr',klasse:'7.-9. kl.',type:'begreb',icon:'🧠',titel:'Mental sundhed og sport',tekst:'Fysisk aktivitet frigiver endorfiner der forbedrer humøret. Regelmæssig motion reducerer stress og angst.',tip:'30 min. moderat motion dagligt anbefales til unge — og det tæller idrætstimerne!'},

  // BRØKER 3.-4. kl.
  {id:'br1',fag:'mat',klasse:'3.-4. kl.',type:'regel',icon:'½',titel:'Hvad er en brøk?',tekst:'En brøk viser en del af en helhed. Tælleren (øverst) viser hvor mange dele du har. Nævneren (nederst) viser hvor mange dele der er i alt.',formel:'3/4 = 3 ud af 4 dele',tip:'Pizza-trick: nævner = antal stykker, tæller = dine stykker'},
  {id:'br2',fag:'mat',klasse:'3.-4. kl.',type:'regel',icon:'½',titel:'Sammenlign brøker',tekst:'Ens nævner: størst tæller vinder. Ens tæller: mindst nævner vinder.',formel:'3/8 < 5/8   og   1/3 > 1/5',tip:'Find fælles nævner for nem sammenligning'},
  {id:'br3',fag:'mat',klasse:'3.-4. kl.',type:'formel',icon:'½',titel:'Brøk af et tal',tekst:'Del med nævneren, gang med tælleren.',formel:'3/4 af 20 = 20 / 4 x 3 = 15',tip:'Del FØRST, gang DEREFTER'},
  // BRØKER 5.-6. kl.
  {id:'br4',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Plus med brøker — ens nævner',tekst:'Nævnerne er ens: læg tællerne sammen. Nævneren forbliver.',formel:'2/7 + 3/7 = 5/7',tip:'Nævneren ændrer sig ALDRIG ved plus/minus'},
  {id:'br5',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Plus med brøker — forskellig nævner',tekst:'Find fælles nævner. Udvid begge brøker. Læg tællerne sammen.',formel:'1/3 + 1/4 = 4/12 + 3/12 = 7/12',tip:'Fælles nævner: find mindste fælles multiplum'},
  {id:'br6',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Minus med brøker',tekst:'Samme som plus — find fælles nævner og træk tællerne fra.',formel:'3/4 - 1/3 = 9/12 - 4/12 = 5/12',tip:'Husk: nævneren ændrer sig ikke'},
  {id:'br7',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Gange brøker',tekst:'Gang tæller med tæller og nævner med nævner. Ingen fælles nævner behøves.',formel:'2/3 x 3/4 = 6/12 = 1/2',tip:'Forkort gerne FØR du ganger'},
  {id:'br8',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Dividere med brøker',tekst:'Vend den anden brøk på hovedet og gang i stedet.',formel:'2/3 / 4/5 = 2/3 x 5/4 = 10/12 = 5/6',tip:'Husk: VEND og GANG'},
  {id:'br9',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Forkorte brøker',tekst:'Del tæller og nævner med den samme fælles faktor.',formel:'12/18 = 2/3   (deler med 6)',tip:'Find den største fælles faktor for at forkorte på én gang'},
  {id:'br10',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Udvide brøker',tekst:'Gang tæller og nævner med det samme tal. Værdien ændres ikke.',formel:'1/3 x 4/4 = 4/12',tip:'Udvider du korrekt er de to brøker ækvivalente'},
  {id:'br11',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Brøk til decimaltal',tekst:'Divider tæller med nævner.',formel:'3/4 = 3 / 4 = 0,75   og   1/3 = 0,333...',tip:'Husk: 1/2=0,5  1/4=0,25  3/4=0,75  1/5=0,2'},
  {id:'br12',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Decimaltal til brøk',tekst:'Skriv som brøk med 10, 100 eller 1000 i nævner. Forkort.',formel:'0,75 = 75/100 = 3/4   og   0,4 = 4/10 = 2/5',tip:'1 decimal=10, 2 decimaler=100, 3 decimaler=1000'},
  {id:'br13',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Blandet tal og uægte brøk',tekst:'Blandet tal: helt tal + brøk. Uægte brøk: tæller større end nævner.',formel:'2½ = 5/2   og   7/3 = 2⅓',tip:'Blandet til uægte: nævner x helt tal + tæller'},

  {id:'pc4',fag:'mat',klasse:'7.-9. kl.',type:'formel',icon:'📈',titel:'Procentvis ændring',tekst:'Beregn stigning eller fald i procent.',formel:'Aendring% = (ny - gammel) / gammel x 100\n120 til 150: 25% stigning',tip:'Positivt = stigning. Negativt = fald'},

  {id:'rh1',fag:'mat',klasse:'5.-6. kl.',type:'regel',icon:'🔢',titel:'Rækkefølgen i regning (POGP)',tekst:'Der er en bestemt rækkefølge: Parenteser, pOtenser, Gange/dividere, Plus/minus.',formel:'3 + 4 x 2 = 3 + 8 = 11   (IKKE 14!)',tip:'Husk: Parenteser og potenser ALTID først'},

async function saveCustom(){
  localStorage.setItem('huskeapp-custom', JSON.stringify(custom));
  localStorage.setItem('huskeapp-videos', JSON.stringify(videoLinks));
  try {
    await fetch('https://api.jsonbin.io/v3/b/' + BIN_ID_H, {
      method: 'PUT',
      headers: {'Content-Type':'application/json','X-Master-Key':API_KEY_H},
      body: JSON.stringify({custom, videos: videoLinks})
    });
  } catch(e) {}
}

async function loadFromCloud() {
  // Load local first
  try {
    const lc = localStorage.getItem('huskeapp-custom');
    if (lc) custom = JSON.parse(lc);
    const lv = localStorage.getItem('huskeapp-videos');
    if (lv) videoLinks = JSON.parse(lv);
  } catch(e) {}
  // Then try cloud
  try {
    const r = await fetch('https://api.jsonbin.io/v3/b/' + BIN_ID_H + '/latest', {
      headers: {'X-Master-Key': API_KEY_H, 'X-Bin-Meta': 'false'}
    });
    if (r.ok) {
      const d = await r.json();
      if (d && d.custom) {
        custom = d.custom;
        videoLinks = d.videos || {};
        localStorage.setItem('huskeapp-custom', JSON.stringify(custom));
        localStorage.setItem('huskeapp-videos', JSON.stringify(videoLinks));
      }
    }
  } catch(e) {}
  render();
}

function allData(){return [...BUILT_IN,...custom];}

function getFag(id){return FAGER.find(f=>f.id===id)||FAGER[0];}

function render(){
  searchQ=document.getElementById('search').value.toLowerCase();
  // Fag tabs
  document.getElementById('fag-tabs').innerHTML=FAGER.map(f=>`
    <button class="ftab${activeFag===f.id?' active':''}"
      style="${activeFag===f.id?'background:'+f.bg+';color:'+f.color+';border-color:'+f.color:''}"
      onclick="setFag('${f.id}')">${f.emoji} ${f.label}</button>
  `).join('');
  // Klasse tabs
  document.getElementById('klasse-tabs').innerHTML=KL.map(k=>`
    <button class="ktab${activeKl===k?' active':''}" onclick="setKl('${k}')">${k}</button>
  `).join('');
  // Filter
  let data=allData().filter(d=>{
    if(activeFag!=='alle'&&d.fag!==activeFag)return false;
    if(activeKl!=='Alle'&&d.klasse!==activeKl)return false;
    if(searchQ&&!d.titel.toLowerCase().includes(searchQ)&&!(d.tekst||'').toLowerCase().includes(searchQ)&&!(d.formel||'').toLowerCase().includes(searchQ))return false;
    return true;
  });
  if(!data.length){document.getElementById('content').innerHTML='<div class="no-res">🔍 Ingen resultater — prøv en anden søgning</div>';return;}
  const groups={regel:[], formel:[], begreb:[], glose:[]};
  data.forEach(d=>{ if(groups[d.type])groups[d.type].push(d); else groups['begreb'].push(d);});
  const labels={regel:'📋 Regler',formel:'🧮 Formler',begreb:'💡 Begreber',glose:'📝 Gloser og begreber'};
  let html='';
  ['regel','formel','begreb','glose'].forEach(t=>{
    if(!groups[t].length)return;
    html+=`<div class="sec-head">${labels[t]}</div><div class="cards">${groups[t].map(renderCard).join('')}</div>`;
  });
  document.getElementById('content').innerHTML=html;
}

let videoLinks = JSON.parse(localStorage.getItem('huskeapp-videos') || '{}');

function saveVideos() { saveCustom(); }

function getYouTubeId(url) {
  const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/);
  return match ? match[1] : null;
}

function addVideo(id, event) {
  event.stopPropagation();
  const url = prompt('Indsæt YouTube-link til "' + id + '":');
  if (!url) return;
  const ytId = getYouTubeId(url);
  if (!ytId) { alert('Ikke et gyldigt YouTube-link — prøv igen'); return; }
  videoLinks[id] = ytId;
  saveVideos();
  render();
}

function removeVideo(id, event) {
  event.stopPropagation();
  delete videoLinks[id];
  saveVideos();
  render();
}

      <div class="cicon" style="background:${fag.bg};color:${fag.color}">${d.icon||'📌'}</div>

        <div class="cmeta">${d.klasse} · ${d.type}${isCustom?' · ✏️ din regel':''}${ytId?' · 📺':''}</div>
      </div>
      <div class="carr">▼</div>
    </div>
    <div class="cbody">

      ${d.formel?`<div class="cformel">${d.formel.replace(/\n/g,'<br>')}</div>`:''}
      ${d.tip?`<div class="ctip">💡 ${d.tip}</div>`:''}
      ${ytId?`
        <div style="margin-top:.75rem;border-radius:10px;overflow:hidden;aspect-ratio:16/9">
          <iframe width="100%" height="100%" src="https://www.youtube.com/embed/${ytId}" frameborder="0" allowfullscreen style="display:block;border-radius:10px"></iframe>
        </div>
      `:''}
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:.65rem;flex-wrap:wrap;gap:6px">
        <span class="cbadge" style="background:${fag.bg};color:${fag.color}">${fag.emoji} ${fag.label}</span>
        <div style="display:flex;gap:5px">
          ${ytId
            ? `<button onclick="removeVideo('${d.id}',event)" style="font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;color:var(--muted)">🗑 Fjern video</button>`
            : `<button onclick="addVideo('${d.id}',event)" style="font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;color:var(--muted)">📺 Tilføj video</button>`
          }
          ${isCustom?`<button onclick="event.stopPropagation();openEdit('${d.id}')" style="font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;color:var(--muted)">Rediger</button>`:''}

      </div>

}

let tlFilter = 'Alle';

function toggleTidslinje() {
  const ov = document.getElementById('tl-overlay');
  ov.classList.toggle('open');
  if(ov.classList.contains('open')) renderTl();
}

function renderTl() {
  const search = (document.getElementById('tl-search').value || '').toLowerCase();
  // Filter tabs
  document.getElementById('tl-filter').innerHTML = ['Alle','Danmark','Verden'].map(f =>
    '<button class="tl-ftab' + (tlFilter===f?' active':'') + '" onclick="setTlFilter(\''+f+'\')">' + f + '</button>'
  ).join('');

  let events = TL_EVENTS.filter(e => {
    if(tlFilter !== 'Alle' && e.tag !== tlFilter) return false;
    if(search && !e.event.toLowerCase().includes(search) && !e.desc.toLowerCase().includes(search)) return false;
    return true;
  });

  // Group by century/period
  const periods = [
    {label:'Oldtid (før 793 e.Kr.)', from:-99999, to:792},
    {label:'Vikingetid og middelalder (793–1499)', from:793, to:1499},
    {label:'Renæssance og reformation (1500–1699)', from:1500, to:1699},
    {label:'Oplysningstid og revolution (1700–1849)', from:1700, to:1849},
    {label:'Industrialisering og nationalisme (1850–1913)', from:1850, to:1913},
    {label:'Det 20. århundrede (1914–1999)', from:1914, to:1999},
    {label:'Det 21. århundrede (2000–)', from:2000, to:99999},
  ];

  let html = '';
  periods.forEach(p => {
    const pEvents = events.filter(e => e.year >= p.from && e.year <= p.to);
    if(!pEvents.length) return;
    html += '<div class="tl-period"><div class="tl-period-title">' + p.label + '</div>';
    pEvents.forEach(e => {
      html += '<div class="tl-item' + (e.highlight?' highlight':'') + '">' +
        '<div class="tl-card">' +
        '<div class="tl-year">' + e.label + '</div>' +
        '<div class="tl-event">' + e.event + '</div>' +
        '<div class="tl-desc">' + e.desc + '</div>' +
        '<span class="tl-tag" style="background:' + e.color + '22;color:' + e.color + '">' + e.tag + '</span>' +
        '</div></div>';
    });
    html += '</div>';
  });
  document.getElementById('tl-content').innerHTML = html;
}

function setTlFilter(f) { tlFilter = f; renderTl(); }
