<!DOCTYPE html>
<html lang="da" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huskdet! — Vipperød Skole</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
[data-theme="light"]{--bg:#F5F3EE;--surface:#fff;--surface2:#EDEAE4;--border:#DDD9D0;--text:#1A1816;--muted:#8A8480;--faint:#C8C4BF;--sidebar:#1A1816;--stop:#F5F3EE;--card-shadow:0 2px 8px rgba(0,0,0,.06)}
[data-theme="dark"]{--bg:#141210;--surface:#1E1C1A;--surface2:#252321;--border:#333;--text:#F0EDE8;--muted:#8A8480;--faint:#555;--sidebar:#0E0C0A;--stop:#F0EDE8;--card-shadow:0 2px 8px rgba(0,0,0,.2)}
:root{--accent:#C4722A;--r:16px;
  --mat:#534AB7;--mat-bg:#EEEDFE;
  --his:#BA7517;--his-bg:#FAEEDA;
  --kri:#0F6E56;--kri-bg:#E1F5EE;
  --nat:#3B6D11;--nat-bg:#EAF3DE;
  --idr:#993C1D;--idr-bg:#FAECE7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;transition:background .2s,color .2s}

/* Brøkstreger */
.brok{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-size:.9em;margin:0 2px}
.brok-t{border-bottom:1.5px solid currentColor;padding:0 3px 1px;font-size:.85em}
.brok-n{padding:1px 3px 0;font-size:.85em}

/* HEADER */
.header{background:var(--sidebar);padding:.9rem 1.25rem;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.logo{font-family:'DM Serif Display',serif;font-size:19px;color:var(--stop);flex:1}
.logo span{color:var(--accent);font-style:italic}
.search-wrap{position:relative;flex:1;min-width:160px;max-width:300px}
.search{width:100%;padding:7px 12px 7px 32px;font-size:13px;border:none;border-radius:99px;background:rgba(255,255,255,.12);color:var(--stop);font-family:'DM Sans',sans-serif}
.search::placeholder{color:rgba(255,255,255,.35)}
.search:focus{outline:none;background:rgba(255,255,255,.18)}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);font-size:13px}
.hbtn{padding:6px 12px;border-radius:99px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;transition:all .15s;white-space:nowrap}
.hbtn-ghost{background:rgba(255,255,255,.1);color:var(--stop)}
.hbtn-ghost:hover{background:rgba(255,255,255,.18)}
.hbtn-accent{background:var(--accent);color:#fff}

/* NAV TABS */
.nav-tabs{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.nav-tabs::-webkit-scrollbar{display:none}
.ntab{padding:10px 16px;font-size:13px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:all .15s}
.ntab:hover{color:var(--text)}
.ntab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}

/* FAG TABS */
.fag-tabs{display:flex;gap:6px;padding:.75rem 1.25rem;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--border)}
.fag-tabs::-webkit-scrollbar{display:none}
.ftab{padding:5px 12px;font-size:13px;border-radius:99px;border:1.5px solid var(--border);background:none;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .15s;flex-shrink:0}
.ftab.active{font-weight:500;border-color:transparent}
.klasse-bar{display:flex;gap:5px;padding:.6rem 1.25rem;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--border)}
.klasse-bar::-webkit-scrollbar{display:none}
.ktab{padding:4px 10px;font-size:12px;border-radius:99px;border:1px solid var(--border);background:none;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .15s;flex-shrink:0}
.ktab.active{background:var(--text);color:var(--bg);border-color:var(--text)}

/* CONTENT */
.content{padding:1.1rem 1.25rem;max-width:900px;margin:0 auto}
.page{display:none}.page.active{display:block}
.sec-head{font-family:'DM Serif Display',serif;font-size:17px;margin:1.1rem 0 .6rem;display:flex;align-items:center;gap:7px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:8px;margin-bottom:.5rem}

/* KORT */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem;cursor:pointer;transition:all .18s;position:relative;box-shadow:var(--card-shadow)}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-1px)}
.card.fav{border-left:3px solid var(--accent)}
.card-top{display:flex;align-items:flex-start;gap:8px}
.cicon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.chead{flex:1;min-width:0}
.ctitle{font-size:14px;font-weight:500;line-height:1.3}
.cmeta{font-size:11px;color:var(--muted);margin-top:3px}
.carr{font-size:11px;color:var(--faint);transition:transform .2s;margin-top:2px;flex-shrink:0}
.card.open .carr{transform:rotate(180deg)}
.cbody{display:none;margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--border)}
.card.open .cbody{display:block}
.ctekst{font-size:13px;line-height:1.6}
.cformel{background:var(--surface2);border-radius:10px;padding:.7rem 1rem;font-family:monospace;font-size:13px;margin:.5rem 0;line-height:1.7;border-left:3px solid var(--accent)}
.ctip{font-size:12px;color:var(--muted);font-style:italic;margin-top:.5rem;display:flex;align-items:flex-start;gap:5px}
.cbadge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:99px;margin-top:.4rem}
.card-actions{display:flex;gap:5px;margin-top:.6rem;flex-wrap:wrap}
.caction{font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif}
.caction:hover{border-color:var(--accent);color:var(--accent)}
.caction.fav-on{border-color:var(--accent);color:var(--accent)}
.video-wrap{margin-top:.75rem;border-radius:10px;overflow:hidden;aspect-ratio:16/9}
.video-wrap iframe{width:100%;height:100%;display:block;border:none}
.no-res{text-align:center;padding:2.5rem;color:var(--muted);font-size:14px}

/* QUIZ */
.quiz-wrap{max-width:600px;margin:0 auto;padding:1.25rem}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.75rem;text-align:center}
.quiz-progress{font-size:12px;color:var(--muted);margin-bottom.5rem}
.quiz-q{font-family:'DM Serif Display',serif;font-size:20px;margin:1rem 0 .5rem;line-height:1.4}
.quiz-hint{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
.quiz-options{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.qopt{padding:11px 16px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);cursor:pointer;font-size:14px;text-align:left;font-family:'DM Sans',sans-serif;color:var(--text);transition:all .15s}
.qopt:hover{border-color:var(--accent)}
.qopt.correct{border-color:#059669;background:#E6F9F1;color:#065F46}
.qopt.wrong{border-color:#DC2626;background:#FEF2F2;color:#991B1B}
.qopt.show-correct{border-color:#059669;background:#E6F9F1;color:#065F46}
[data-theme="dark"] .qopt.correct{background:#021A0E;color:#6EE7B7}
[data-theme="dark"] .qopt.wrong{background:#2A0A0A;color:#FCA5A5}
[data-theme="dark"] .qopt.show-correct{background:#021A0E;color:#6EE7B7}
.quiz-result{font-size:14px;margin:.75rem 0;padding:.75rem;border-radius:8px}
.quiz-score{font-family:'DM Serif Display',serif;font-size:48px;margin:.5rem 0}
.quiz-score-lbl{font-size:14px;color:var(--muted)}
.btn{padding:9px 18px;border-radius:10px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .15s}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{opacity:.9}
.btn-g{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-g:hover{border-color:var(--accent)}

/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;padding:1.5rem}
.mbg.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:var(--r);padding:1.5rem;width:100%;max-width:400px;transform:translateY(10px);transition:transform .2s;max-height:90vh;overflow-y:auto}
.mbg.open .modal{transform:translateY(0)}
.mh{font-family:'DM Serif Display',serif;font-size:19px;margin-bottom:1rem}
.fl{margin-bottom:10px}
.fl label{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.fl input,.fl select,.fl textarea{width:100%;padding:8px 10px;font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:none;border-color:var(--accent)}
.fl textarea{height:75px;resize:vertical}
.mact{display:flex;gap:7px;justify-content:flex-end;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}
.btn-c{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--muted)}
.btn-s{padding:7px 16px;border:none;border-radius:8px;background:var(--text);color:var(--bg);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500}
.btn-s:hover{background:var(--accent)}
.btn-d{padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;color:#7A2D2D;margin-right:auto}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Husk<span>det!</span></div>
  <div class="search-wrap">
    <span class="si">🔍</span>
    <input class="search" type="text" placeholder="Søg regel, begreb..." id="search" oninput="render()">
  </div>
  <button class="hbtn hbtn-ghost" onclick="toggleTheme()" id="theme-btn">🌙</button>
  <button class="hbtn hbtn-accent" onclick="openModal()">+ Tilføj</button>
</div>

<div class="nav-tabs">
  <button class="ntab active" onclick="setNav('regler')">📚 Regler</button>
  <button class="ntab" onclick="setNav('favoritter')">⭐ Favoritter</button>
  <button class="ntab" onclick="setNav('quiz')">🧠 Quiz</button>
</div>

<div id="filters-bar">
  <div class="fag-tabs" id="fag-tabs"></div>
  <div class="klasse-bar" id="klasse-tabs"></div>
</div>

<div class="content">
  <div class="page active" id="page-regler">
    <div id="cards-output"></div>
  </div>
  <div class="page" id="page-favoritter">
    <div id="fav-output"></div>
  </div>
  <div class="page" id="page-quiz">
    <div class="quiz-wrap" id="quiz-output"></div>
  </div>
</div>

<!-- TILFØJ/REDIGER MODAL -->
<div class="mbg" id="mbg" onclick="closeBg(event)">
  <div class="modal">
    <div class="mh" id="mtitle">Tilføj regel</div>
    <div class="fl"><label>Fag</label>
      <select id="f-fag">
        <option value="mat">Matematik</option>
        <option value="his">Historie</option>
        <option value="kri">Kristendom</option>
        <option value="nat">Natur/teknologi</option>
        <option value="idr">Idræt</option>
      </select>
    </div>
    <div class="fl"><label>Klassetrin</label>
      <select id="f-kl">
        <option>1.-2. kl.</option><option>3.-4. kl.</option><option>5.-6. kl.</option><option>7.-9. kl.</option>
      </select>
    </div>
    <div class="fl"><label>Type</label>
      <select id="f-type">
        <option value="regel">Regel</option><option value="formel">Formel</option><option value="begreb">Begreb</option>
      </select>
    </div>
    <div class="fl"><label>Titel</label><input type="text" id="f-titel" placeholder="fx Areal af trekant"></div>
    <div class="fl"><label>Ikon (emoji)</label><input type="text" id="f-icon" placeholder="📐" maxlength="4"></div>
    <div class="fl"><label>Forklaring</label><textarea id="f-tekst" placeholder="Forklar reglen..."></textarea></div>
    <div class="fl"><label>Formel / eksempel</label><input type="text" id="f-formel" placeholder="fx A = l × b"></div>
    <div class="fl"><label>Husk-tip</label><input type="text" id="f-tip" placeholder="fx Husk: længde gange bredde"></div>
    <div class="mact">
      <button class="btn-d" id="btn-del" style="display:none" onclick="delCard()">Slet</button>
      <button class="btn-c" onclick="closeModal()">Annuller</button>
      <button class="btn-s" onclick="saveCard()">Gem</button>
    </div>
  </div>
</div>

  // MATEMATIK 1.-2.

// ── STATE ──
let custom = [];
let videoLinks = {};
let favoritter = new Set();
let openCards = new Set();
let editingId = null;
let activeFag = 'alle';
let activeKl = 'Alle';
let activeNav = 'regler';
let searchQ = '';

// Quiz state
let quizData = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;

// ── CLOUD ──
async function saveToCloud() {
  localStorage.setItem('h-custom', JSON.stringify(custom));
  localStorage.setItem('h-videos', JSON.stringify(videoLinks));
  localStorage.setItem('h-favs', JSON.stringify([...favoritter]));
  try {
    await fetch('https://api.jsonbin.io/v3/b/' + BIN_ID, {
      method: 'PUT',
      headers: {'Content-Type':'application/json','X-Master-Key':API_KEY},
      body: JSON.stringify({custom, videos: videoLinks, favs: [...favoritter]})
    });
  } catch(e) {}
}

async function loadFromCloud() {
  // Local first
  try {
    const lc = localStorage.getItem('h-custom'); if(lc) custom = JSON.parse(lc);
    const lv = localStorage.getItem('h-videos'); if(lv) videoLinks = JSON.parse(lv);
    const lf = localStorage.getItem('h-favs'); if(lf) favoritter = new Set(JSON.parse(lf));
  } catch(e) {}
  render();
  // Then cloud
  try {
    const r = await fetch('https://api.jsonbin.io/v3/b/' + BIN_ID + '/latest', {
      headers: {'X-Master-Key': API_KEY, 'X-Bin-Meta': 'false'}
    });
    if (r.ok) {
      const d = await r.json();
      if (d && d.custom !== undefined) {
        custom = d.custom || [];
        videoLinks = d.videos || {};
        favoritter = new Set(d.favs || []);
        localStorage.setItem('h-custom', JSON.stringify(custom));
        localStorage.setItem('h-videos', JSON.stringify(videoLinks));
        localStorage.setItem('h-favs', JSON.stringify([...favoritter]));
        render();
      }
    }
  } catch(e) {}
}

// ── HELPERS ──
function allData() { return [...BUILT_IN, ...custom]; }
function getFag(id) { return FAGER.find(f => f.id === id) || FAGER[0]; }
function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

function toggleTheme() {
  const t = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('h-theme', t);
  document.getElementById('theme-btn').textContent = t === 'dark' ? '☀️' : '🌙';
}

function getYouTubeId(url) {
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

// ── NAV ──
function setNav(nav) {
  activeNav = nav;
  document.querySelectorAll('.ntab').forEach((t,i) => t.classList.toggle('active', ['regler','favoritter','quiz'][i] === nav));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + nav).classList.add('active');
  document.getElementById('filters-bar').style.display = nav === 'quiz' ? 'none' : 'block';
  render();
}

function setFag(f) { activeFag = f; render(); }
function setKl(k) { activeKl = k; render(); }

// ── RENDER ──
function render() {
  searchQ = document.getElementById('search').value.toLowerCase();
  renderFagTabs();
  renderKlasseTabs();
  if (activeNav === 'regler') renderRegler();
  if (activeNav === 'favoritter') renderFavoritter();
  if (activeNav === 'quiz' && quizData.length === 0) renderQuizStart();
}

function renderFagTabs() {
  document.getElementById('fag-tabs').innerHTML = FAGER.map(f =>
    `<button class="ftab${activeFag===f.id?' active':''}"
      style="${activeFag===f.id?'background:'+f.bg+';color:'+f.color+';border-color:'+f.color:''}"
      onclick="setFag('${f.id}')">${f.emoji} ${f.label}</button>`
  ).join('');
}

function renderKlasseTabs() {
  document.getElementById('klasse-tabs').innerHTML = KL.map(k =>
    `<button class="ktab${activeKl===k?' active':''}" onclick="setKl('${k}')">${k}</button>`
  ).join('');
}

function filterData() {
  return allData().filter(d => {
    if (activeFag !== 'alle' && d.fag !== activeFag) return false;
    if (activeKl !== 'Alle' && d.klasse !== activeKl) return false;
    if (searchQ && !d.titel.toLowerCase().includes(searchQ) && !(d.tekst||'').toLowerCase().includes(searchQ)) return false;
    return true;
  });
}

function renderRegler() {
  const data = filterData();
  if (!data.length) { document.getElementById('cards-output').innerHTML = '<div class="no-res">🔍 Ingen resultater</div>'; return; }
  const groups = {regel:[], formel:[], begreb:[]};
  data.forEach(d => { if(groups[d.type]) groups[d.type].push(d); else groups.begreb.push(d); });
  const labels = {regel:'📋 Regler', formel:'🧮 Formler', begreb:'💡 Begreber'};
  let html = '';
  ['regel','formel','begreb'].forEach(t => {
    if (!groups[t].length) return;
    html += `<div class="sec-head">${labels[t]}</div><div class="cards">${groups[t].map(renderCard).join('')}</div>`;
  });
  document.getElementById('cards-output').innerHTML = html;
}

function renderFavoritter() {
  const favs = allData().filter(d => favoritter.has(d.id));
  if (!favs.length) {
    document.getElementById('fav-output').innerHTML = '<div class="no-res">⭐ Ingen favoritter endnu — åbn et kort og klik "Tilføj favorit"</div>';
    return;
  }
  document.getElementById('fav-output').innerHTML = `<div class="cards">${favs.map(renderCard).join('')}</div>`;
}

function renderBrok(tekst) {
  // Erstat a/b mønstre med visuelle brøker (undtagen URL-lignende)
  return tekst.replace(/\b(\d+)\/([1-9]\d*)\b/g, (match, t, n) => {
    return `<span class="brok"><span class="brok-t">${t}</span><span class="brok-n">${n}</span></span>`;
  });
}

function renderCard(d) {
  const fag = getFag(d.fag);
  const isOpen = openCards.has(d.id);
  const isFav = favoritter.has(d.id);
  const isCustom = custom.find(c => c.id === d.id);
  const ytId = videoLinks[d.id];
  return `<div class="card${isOpen?' open':''}${isFav?' fav':''}" onclick="toggleCard('${d.id}')">
    <div class="card-top">
      <div class="cicon" style="background:${fag.bg};color:${fag.color}">${d.icon||'📌'}</div>
      <div class="chead">
        <div class="ctitle">${d.titel}</div>
        <div class="cmeta">${d.klasse} · ${d.type}${isFav?' · ⭐':''}${ytId?' · 📺':''}</div>
      </div>
      <div class="carr">▼</div>
    </div>
    <div class="cbody">
      <div class="ctekst">${renderBrok((d.tekst||'')).replace(/\n/g,'<br>')}</div>
      ${d.formel?`<div class="cformel">${renderBrok(d.formel).replace(/\n/g,'<br>')}</div>`:''}
      ${d.tip?`<div class="ctip">💡 ${d.tip}</div>`:''}
      ${ytId?`<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>`:''}
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:.5rem;flex-wrap:wrap;gap:5px">
        <span class="cbadge" style="background:${fag.bg};color:${fag.color}">${fag.emoji} ${fag.label}</span>
        <div class="card-actions">
          <button class="caction${isFav?' fav-on':''}" onclick="toggleFav('${d.id}',event)">${isFav?'⭐ Fjern':'☆ Favorit'}</button>
          ${ytId
            ? `<button class="caction" onclick="removeVideo('${d.id}',event)">🗑 Video</button>`
            : `<button class="caction" onclick="addVideo('${d.id}',event)">📺 Video</button>`}
          ${isCustom?`<button class="caction" onclick="event.stopPropagation();openEdit('${d.id}')">✏️ Rediger</button>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

function toggleCard(id) {
  if (openCards.has(id)) openCards.delete(id); else openCards.add(id);
  render();
}

async function toggleFav(id, e) {
  e.stopPropagation();
  if (favoritter.has(id)) favoritter.delete(id); else favoritter.add(id);
  await saveToCloud();
  render();
}

async function addVideo(id, e) {
  e.stopPropagation();
  const url = prompt('Indsæt YouTube-link:');
  if (!url) return;
  const ytId = getYouTubeId(url);
  if (!ytId) { alert('Ikke et gyldigt YouTube-link'); return; }
  videoLinks[id] = ytId;
  await saveToCloud();
  render();
}

async function removeVideo(id, e) {
  e.stopPropagation();
  delete videoLinks[id];
  await saveToCloud();
  render();
}

// ── QUIZ ──
function renderQuizStart() {
  document.getElementById('quiz-output').innerHTML = `
    <div class="quiz-card">
      <div style="font-size:48px;margin-bottom:.75rem">🧠</div>
      <div style="font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:.5rem">Quiz dig selv!</div>
      <div style="font-size:14px;color:var(--muted);margin-bottom:1.5rem">Test om du husker reglerne</div>
      <div style="margin-bottom:1rem">
        <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:5px">Vælg fag</label>
        <select id="quiz-fag" style="width:100%;padding:9px 12px;font-size:14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif">
          <option value="alle">Alle fag</option>
          ${FAGER.slice(1).map(f=>`<option value="${f.id}">${f.emoji} ${f.label}</option>`).join('')}
        </select>
      </div>
      <div style="margin-bottom:1.5rem">
        <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:5px">Klassetrin</label>
        <select id="quiz-kl" style="width:100%;padding:9px 12px;font-size:14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif">
          ${KL.map(k=>`<option value="${k}">${k}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-p" style="width:100%;justify-content:center" onclick="startQuiz()">Start quiz →</button>
    </div>`;
}

function startQuiz() {
  const fag = document.getElementById('quiz-fag').value;
  const kl = document.getElementById('quiz-kl').value;
  let pool = allData().filter(d => {
    if (fag !== 'alle' && d.fag !== fag) return false;
    if (kl !== 'Alle' && d.klasse !== kl) return false;
    return d.tekst && d.titel;
  });
  if (pool.length < 3) { alert('Ikke nok kort til quiz — vælg flere fag eller klassetrin'); return; }
  // Bland og tag max 10
  pool = pool.sort(() => Math.random() - .5).slice(0, 10);
  quizData = pool;
  quizIndex = 0;
  quizScore = 0;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  if (quizIndex >= quizData.length) { renderQuizSlut(); return; }
  const kort = quizData[quizIndex];
  const fag = getFag(kort.fag);
  quizAnswered = false;

  // Lav 4 svarmuligheder — 1 rigtig + 3 forkerte fra SAMME FAG
  const rigtig = kort.titel;
  const sammePool = allData().filter(d => d.id !== kort.id && d.titel !== rigtig && d.fag === kort.fag);
  const andrePool = sammePool.length >= 3 ? sammePool : allData().filter(d => d.id !== kort.id && d.titel !== rigtig);
  const andre = andrePool.sort(() => Math.random() - .5).slice(0, 3).map(d => d.titel);
  const options = [rigtig, ...andre].sort(() => Math.random() - .5);

  document.getElementById('quiz-output').innerHTML = `
    <div class="quiz-card">
      <div style="font-size:12px;color:var(--muted);margin-bottom:.5rem">Spørgsmål ${quizIndex+1} af ${quizData.length}</div>
      <div style="background:${fag.bg};color:${fag.color};display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11px;margin-bottom:.75rem">${fag.emoji} ${fag.label} · ${kort.klasse}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:.5rem">Hvad hedder denne regel/formel?</div>
      <div style="background:var(--surface2);border-radius:10px;padding:1rem;margin-bottom:1.25rem;font-size:14px;line-height:1.6;text-align:left">
        ${(kort.tekst||'').substring(0,150)}${(kort.tekst||'').length>150?'...':''}
        ${kort.formel?`<div style="font-family:monospace;font-size:13px;margin-top:.5rem;color:var(--accent)">${kort.formel.split('\n')[0]}</div>`:''}
      </div>
      <div class="quiz-options" id="quiz-opts">
        ${options.map(o => `<button class="qopt" onclick="svarQuiz('${o.replace(/'/g,"\\'")}','${rigtig.replace(/'/g,"\\'")}',this)">${o}</button>`).join('')}
      </div>
      <div id="quiz-feedback" style="height:40px"></div>
    </div>`;
}

function svarQuiz(svar, rigtig, el) {
  if (quizAnswered) return;
  quizAnswered = true;
  const korrekt = svar === rigtig;
  if (korrekt) quizScore++;

  document.querySelectorAll('.qopt').forEach(btn => {
    btn.onclick = null;
    if (btn.textContent === rigtig) btn.classList.add('correct');
    else if (btn === el && !korrekt) btn.classList.add('wrong');
  });

  document.getElementById('quiz-feedback').innerHTML = `
    <div style="margin-top:.5rem;font-size:14px;color:${korrekt?'#059669':'#DC2626'}">${korrekt?'✓ Rigtigt!':'✗ Forkert — det var: '+rigtig}</div>`;

  setTimeout(() => { quizIndex++; renderQuizQuestion(); }, 1500);
}

function renderQuizSlut() {
  const pct = Math.round(quizScore / quizData.length * 100);
  const emoji = pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '💪';
  const tekst = pct >= 80 ? 'Fremragende!' : pct >= 50 ? 'Godt klaret!' : 'Øv lidt mere!';
  document.getElementById('quiz-output').innerHTML = `
    <div class="quiz-card">
      <div style="font-size:56px;margin-bottom:.5rem">${emoji}</div>
      <div style="font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:.25rem">${tekst}</div>
      <div class="quiz-score">${quizScore}/${quizData.length}</div>
      <div class="quiz-score-lbl">${pct}% korrekte svar</div>
      <div style="margin-top:1.5rem;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-p" onclick="quizData=[];renderQuizStart()">Ny quiz</button>
        <button class="btn btn-g" onclick="quizIndex=0;quizScore=0;renderQuizQuestion()">Prøv igen</button>
      </div>
    </div>`;
}

// ── MODAL ──
function openModal() {
  editingId = null;
  document.getElementById('mtitle').textContent = 'Tilføj regel';
  document.getElementById('btn-del').style.display = 'none';
  ['f-titel','f-icon','f-tekst','f-formel','f-tip'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-icon').value = '📌';
  document.getElementById('mbg').classList.add('open');
  setTimeout(() => document.getElementById('f-titel').focus(), 200);
}

function openEdit(id) {
  const d = custom.find(c => c.id === id); if (!d) return;
  editingId = id;
  document.getElementById('mtitle').textContent = 'Rediger';
  document.getElementById('btn-del').style.display = 'inline-flex';
  document.getElementById('f-fag').value = d.fag;
  document.getElementById('f-kl').value = d.klasse;
  document.getElementById('f-type').value = d.type;
  document.getElementById('f-titel').value = d.titel;
  document.getElementById('f-icon').value = d.icon || '📌';
  document.getElementById('f-tekst').value = d.tekst || '';
  document.getElementById('f-formel').value = d.formel || '';
  document.getElementById('f-tip').value = d.tip || '';
  document.getElementById('mbg').classList.add('open');
}

function closeModal() { document.getElementById('mbg').classList.remove('open'); }
function closeBg(e) { if (e.target.id === 'mbg') closeModal(); }

async function saveCard() {
  const titel = document.getElementById('f-titel').value.trim();
  if (!titel) { document.getElementById('f-titel').focus(); return; }
  const obj = {
    id: editingId || 'c-' + Date.now(),
    fag: document.getElementById('f-fag').value,
    klasse: document.getElementById('f-kl').value,
    type: document.getElementById('f-type').value,
    titel,
    icon: document.getElementById('f-icon').value || '📌',
    tekst: document.getElementById('f-tekst').value,
    formel: document.getElementById('f-formel').value,
    tip: document.getElementById('f-tip').value,
  };
  if (editingId) custom = custom.map(c => c.id === editingId ? obj : c);
  else custom.push(obj);
  await saveToCloud();
  closeModal(); render();
}

async function delCard() {
  if (!confirm('Slet?')) return;
  custom = custom.filter(c => c.id !== editingId);
  await saveToCloud();
  closeModal(); render();
}

// ── INIT ──
const savedTheme = localStorage.getItem('h-theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
document.getElementById('theme-btn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
loadFromCloud();
</script>
