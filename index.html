<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huskdet!</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5F3EE;--surface:#fff;--s2:#EDEAE4;--border:#DDD9D0;--text:#1A1816;--muted:#8A8480;--accent:#C4722A}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:#1A1816;padding:.9rem 1.25rem;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.logo{font-family:'DM Serif Display',serif;font-size:19px;color:#F5F3EE;flex:1}
.logo span{color:var(--accent);font-style:italic}
.sw{position:relative;flex:1;min-width:150px;max-width:280px}
.search{width:100%;padding:7px 12px 7px 30px;font-size:13px;border:none;border-radius:99px;background:rgba(255,255,255,.12);color:#F5F3EE;font-family:'DM Sans',sans-serif}
.search::placeholder{color:rgba(255,255,255,.4)}
.search:focus{outline:none}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);font-size:12px}
.hb{padding:6px 12px;border-radius:99px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500}
.hb-g{background:rgba(255,255,255,.1);color:#F5F3EE}
.hb-a{background:var(--accent);color:#fff}
.nav-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
.nt{padding:10px 16px;font-size:13px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif}
.nt.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.fag-bar{display:flex;gap:6px;padding:.75rem 1.25rem;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--border)}
.fag-bar::-webkit-scrollbar{display:none}
.ft{padding:5px 12px;font-size:13px;border-radius:99px;border:1.5px solid var(--border);background:none;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;color:var(--muted)}
.ft.active{font-weight:500;border-color:transparent}
.kl-bar{display:flex;gap:5px;padding:.6rem 1.25rem;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--border)}
.kl-bar::-webkit-scrollbar{display:none}
.kt{padding:4px 10px;font-size:12px;border-radius:99px;border:1px solid var(--border);background:none;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;color:var(--muted)}
.kt.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.content{padding:1rem 1.25rem;max-width:900px;margin:0 auto}
.page{display:none}.page.active{display:block}
.sh{font-family:'DM Serif Display',serif;font-size:17px;margin:1rem 0 .6rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:8px;margin-bottom:.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card:hover{box-shadow:0 3px 12px rgba(0,0,0,.1)}
.ctop{display:flex;align-items:flex-start;gap:9px}
.ci{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ch{flex:1}
.ctit{font-size:14px;font-weight:500;line-height:1.3}
.cmet{font-size:11px;color:var(--muted);margin-top:3px}
.carr{font-size:11px;color:#C8C4BF;margin-top:2px;flex-shrink:0;transition:transform .2s}
.card.open .carr{transform:rotate(180deg)}
.cbody{display:none;margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border)}
.card.open .cbody{display:block}
.ctekst{font-size:13px;line-height:1.7}
.cformel{background:var(--s2);border-radius:10px;padding:.65rem .9rem;font-family:monospace;font-size:13px;margin:.5rem 0;line-height:1.6;border-left:3px solid var(--accent)}
.ctip{font-size:12px;color:var(--muted);font-style:italic;margin-top:.5rem}
.cbadge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:99px;margin-top:.4rem}
.cact{font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif}
.cact:hover{border-color:var(--accent);color:var(--accent)}
.cact.on{border-color:var(--accent);color:var(--accent)}
.vw{margin-top:.75rem;border-radius:10px;overflow:hidden;aspect-ratio:16/9}
.vw iframe{width:100%;height:100%;display:block;border:none}
.no-res{text-align:center;padding:2.5rem;color:var(--muted);font-size:14px}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.75rem;text-align:center;max-width:580px;margin:1.25rem auto}
.qopt{padding:11px 16px;border:1.5px solid var(--border);border-radius:10px;background:var(--s2);cursor:pointer;font-size:14px;text-align:left;font-family:'DM Sans',sans-serif;color:var(--text);display:block;width:100%;margin-bottom:8px}
.qopt.ok{border-color:#059669;background:#E6F9F1;color:#065F46}
.qopt.fej{border-color:#DC2626;background:#FEF2F2;color:#991B1B}
.btn{padding:9px 18px;border-radius:10px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500}
.btn-p{background:var(--accent);color:#fff}
.btn-g{background:var(--s2);color:var(--text);border:1px solid var(--border)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100;padding:1.5rem}
.mbg.open{display:flex}
.modal{background:var(--surface);border-radius:14px;padding:1.5rem;width:100%;max-width:400px;max-height:90vh;overflow-y:auto}
.mh{font-family:'DM Serif Display',serif;font-size:19px;margin-bottom:1rem}
.fl{margin-bottom:10px}
.fl label{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:3px;text-transform:uppercase}
.fl input,.fl select,.fl textarea{width:100%;padding:8px 10px;font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
.fl textarea{height:75px;resize:vertical}
.mact{display:flex;gap:7px;justify-content:flex-end;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}
.bc{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--muted)}
.bs{padding:7px 16px;border:none;border-radius:8px;background:var(--text);color:var(--bg);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500}
.bd{padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;color:#7A2D2D;margin-right:auto}
.brok{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-size:.9em;margin:0 2px}
.bt{border-bottom:1.5px solid currentColor;padding:0 3px 1px;font-size:.85em}
.bn{padding:1px 3px 0;font-size:.85em}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Husk<span>det!</span></div>
  <div class="sw"><span class="si">🔍</span><input class="search" type="text" placeholder="Søg..." id="search" oninput="render()"></div>
  <button class="hb hb-a" onclick="openModal()">+ Tilføj</button>
</div>

<div class="nav-tabs">
  <button class="nt active" onclick="setNav('regler')">📚 Regler</button>
  <button class="nt" onclick="setNav('favoritter')">⭐ Favoritter</button>
  <button class="nt" onclick="setNav('quiz')">🧠 Quiz</button>
</div>

<div id="filter-bar">
  <div class="fag-bar" id="fag-bar"></div>
  <div class="kl-bar" id="kl-bar"></div>
</div>

<div class="content">
  <div class="page active" id="p-regler"><div id="o-regler"></div></div>
  <div class="page" id="p-favoritter"><div id="o-fav"></div></div>
  <div class="page" id="p-quiz"><div id="o-quiz"></div></div>
</div>

<div class="mbg" id="mbg" onclick="if(event.target===this)lukkModal()">
  <div class="modal">
    <div class="mh" id="m-titel">Tilføj regel</div>
    <div class="fl"><label>Fag</label><select id="f-fag">
      <option value="mat">Matematik</option><option value="his">Historie</option>
      <option value="kri">Kristendom</option><option value="nat">Natur/teknologi</option><option value="idr">Idræt</option>
    </select></div>
    <div class="fl"><label>Klassetrin</label><select id="f-kl">
      <option>1.-2. kl.</option><option>3.-4. kl.</option><option>5.-6. kl.</option><option>7.-9. kl.</option>
    </select></div>
    <div class="fl"><label>Type</label><select id="f-type">
      <option value="regel">Regel</option><option value="formel">Formel</option><option value="begreb">Begreb</option>
    </select></div>
    <div class="fl"><label>Titel</label><input type="text" id="f-titel" placeholder="fx Areal af trekant"></div>
    <div class="fl"><label>Ikon</label><input type="text" id="f-icon" placeholder="📐" maxlength="4"></div>
    <div class="fl"><label>Forklaring</label><textarea id="f-tekst"></textarea></div>
    <div class="fl"><label>Formel</label><input type="text" id="f-formel"></div>
    <div class="fl"><label>Husk-tip</label><input type="text" id="f-tip"></div>
    <div class="mact">
      <button class="bd" id="btn-del" style="display:none" onclick="delKort()">Slet</button>
      <button class="bc" onclick="lukkModal()">Annuller</button>
      <button class="bs" onclick="gemKort()">Gem</button>
    </div>
  </div>
</div>

<script>
var FAGER = [
  {id:'alle',label:'Alle fag',e:'📚',c:'#534AB7',bg:'#EEEDFE'},
  {id:'mat',label:'Matematik',e:'🔢',c:'#534AB7',bg:'#EEEDFE'},
  {id:'his',label:'Historie',e:'🏛️',c:'#BA7517',bg:'#FAEEDA'},
  {id:'kri',label:'Kristendom',e:'✝️',c:'#0F6E56',bg:'#E1F5EE'},
  {id:'nat',label:'Natur/teknologi',e:'🌱',c:'#3B6D11',bg:'#EAF3DE'},
  {id:'idr',label:'Idræt',e:'⚽',c:'#993C1D',bg:'#FAECE7'}
];
var KL = ['Alle','1.-2. kl.','3.-4. kl.','5.-6. kl.','7.-9. kl.'];

var DATA = [
  {id:'m1',fag:'mat',klasse:'1.-2. kl.',type:'regel',icon:'🔢',titel:'Talsystemet 0-100',tekst:'Vi bruger cifrene 0-9. Tallene er bygget op af tiere og enere. 34 = 3 tiere og 4 enere.',tip:'Tegn tallet som streger for tiere og enere'},
  {id:'m2',fag:'mat',klasse:'1.-2. kl.',type:'regel',icon:'➕',titel:'Plus og minus',tekst:'Plus = lægger sammen. Minus = tager fra.',formel:'3 + 4 = 7   |   7 - 4 = 3',tip:'Brug fingre eller tallinje'},
  {id:'m3',fag:'mat',klasse:'3.-4. kl.',type:'formel',icon:'📐',titel:'Areal af rektangel',tekst:'Areal er pladsen inde i en figur. Måles i cm².',formel:'Areal = længde × bredde',tip:'Eks: 4 cm × 3 cm = 12 cm²'},
  {id:'m4',fag:'mat',klasse:'3.-4. kl.',type:'formel',icon:'📏',titel:'Omkreds',tekst:'Omkreds er den samlede længde rundt om en figur.',formel:'Omkreds = alle sider lagt sammen',tip:'Læg alle sider sammen'},
  {id:'m5',fag:'mat',klasse:'3.-4. kl.',type:'begreb',icon:'½',titel:'Hvad er en brøk?',tekst:'En brøk viser en del af en helhed. Tæller øverst, nævner nederst.',formel:'3/4 = 3 ud af 4 dele',tip:'Pizza-trick: nævner = stykker, tæller = dine stykker'},
  {id:'m6',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Plus med brøker — ens nævner',tekst:'Nævnerne er ens: læg tællerne sammen. Nævneren forbliver.',formel:'2/7 + 3/7 = 5/7',tip:'Nævneren ændrer sig ALDRIG ved plus/minus'},
  {id:'m7',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Plus med brøker — forskellig nævner',tekst:'Find fælles nævner. Udvid begge brøker. Læg tællerne sammen.',formel:'1/3 + 1/4 = 4/12 + 3/12 = 7/12',tip:'Fælles nævner = mindste fælles multiplum'},
  {id:'m8',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Gange brøker',tekst:'Gang tæller med tæller og nævner med nævner.',formel:'2/3 × 3/4 = 6/12 = 1/2',tip:'Forkort gerne FØR du ganger'},
  {id:'m9',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'½',titel:'Dividere med brøker',tekst:'Vend den anden brøk på hovedet og gang i stedet.',formel:'2/3 ÷ 4/5 = 2/3 × 5/4 = 5/6',tip:'VEND og GANG'},
  {id:'m10',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'💯',titel:'Find procenten',tekst:'Hvad procent er delen af det hele?',formel:'Procent = del ÷ hele × 100',tip:'Eks: 15 ud af 60 = 25%'},
  {id:'m11',fag:'mat',klasse:'5.-6. kl.',type:'formel',icon:'💯',titel:'Find delen',tekst:'Hvad er x% af et tal?',formel:'Del = hele × procent ÷ 100',tip:'Eks: 30% af 80 = 24'},
  {id:'m12',fag:'mat',klasse:'5.-6. kl.',type:'regel',icon:'🔢',titel:'Rækkefølgen i regning',tekst:'Parenteser, potenser, gange/dividere, plus/minus.',formel:'3 + 4 × 2 = 11   (IKKE 14!)',tip:'Parenteser ALTID først'},
  {id:'m13',fag:'mat',klasse:'5.-6. kl.',type:'regel',icon:'➖',titel:'Negative tal',tekst:'Plus et negativt tal = minus. Minus et negativt = plus.',formel:'5 + (-3) = 2   og   5 - (-3) = 8',tip:'To minustegn = plus'},
  {id:'m14',fag:'mat',klasse:'5.-6. kl.',type:'begreb',icon:'📊',titel:'Koordinatsystem',tekst:'x-aksen (vandret) og y-aksen (lodret). Punkt skrives (x,y).',formel:'(3, 5) = 3 til højre, 5 op',tip:'"Gå frem, så op"'},
  {id:'m15',fag:'mat',klasse:'5.-6. kl.',type:'regel',icon:'⚖️',titel:'Ligninger',tekst:'En ligning er som en vægt — begge sider skal være lige.',formel:'x + 5 = 12  →  x = 7',tip:'Isolér x: flyt alt andet til den anden side'},
  {id:'m16',fag:'mat',klasse:'5.-6. kl.',type:'begreb',icon:'⭕',titel:'Pi og cirklen',tekst:'Pi (π) ≈ 3,14. r = radius, d = diameter.',formel:'Omkreds = 2 × π × r\nAreal = π × r²',tip:'Eks: r=5 → Areal = 78,5 cm²'},
  {id:'m17',fag:'mat',klasse:'7.-9. kl.',type:'formel',icon:'📐',titel:'Pythagoras',tekst:'I en retvinklet trekant: a² + b² = c².',formel:'a² + b² = c²\nEks: 3² + 4² = 5²',tip:'Tjek altid svaret'},
  {id:'m18',fag:'mat',klasse:'7.-9. kl.',type:'formel',icon:'🔣',titel:'Potenser',tekst:'Et tal ganget med sig selv et bestemt antal gange.',formel:'2³ = 8   og   x⁰ = 1 altid!',tip:'2⁰=1, 2¹=2, 2²=4, 2³=8'},
  {id:'m19',fag:'mat',klasse:'7.-9. kl.',type:'formel',icon:'⚖️',titel:'Løse ligninger',tekst:'Isolér den ubekendte ved at gøre det samme på begge sider.',formel:'2x + 6 = 14  →  x = 4',tip:'Tjek svaret ved at sætte det ind igen'},
  {id:'h1',fag:'his',klasse:'3.-4. kl.',type:'begreb',icon:'📜',titel:'Hvad er historie?',tekst:'Historie er læren om fortiden. Vi bruger kilder til at finde ud af hvad der skete.',tip:'Kilde = alt der kan fortælle os om fortiden'},
  {id:'h2',fag:'his',klasse:'3.-4. kl.',type:'begreb',icon:'⏳',titel:'Tidslinjen',tekst:'f.Kr. tæller baglæns. e.Kr. tæller fremad.',formel:'f.Kr. = før Kristus   |   e.Kr. = efter Kristus',tip:'År 0 er Jesu fødsel'},
  {id:'h3',fag:'his',klasse:'3.-4. kl.',type:'begreb',icon:'⚓',titel:'Vikingetiden',tekst:'793-1066 e.Kr. Vikingerne sejlede, handlede og opdagede nye lande.',formel:'793: Første angreb\n1066: Vikingetiden slutter',tip:'Vikingerne kaldte sig nordmænd'},
  {id:'h4',fag:'his',klasse:'5.-6. kl.',type:'begreb',icon:'🌍',titel:'2. Verdenskrig',tekst:'Danmarks besættelse 1940-1945.',formel:'9/4 1940: Danmark besættes\n5/5 1945: Befrielsen',tip:'Husk begge datoer!'},
  {id:'h5',fag:'his',klasse:'5.-6. kl.',type:'begreb',icon:'📚',titel:'Primær og sekundær kilde',tekst:'Primær: lavet DA det skete. Sekundær: lavet BAGEFTER.',tip:'Primær = fra dengang'},
  {id:'h6',fag:'his',klasse:'5.-6. kl.',type:'begreb',icon:'👑',titel:'Enevælde og demokrati',tekst:'Enevælde: kongen bestemmer alt. Demokrati: folket bestemmer.',formel:'1660: Enevælde\n5. juni 1849: Demokrati',tip:'Grundlovsdagen fejres 5. juni'},
  {id:'k1',fag:'kri',klasse:'1.-2. kl.',type:'begreb',icon:'📖',titel:'Hvad er en myte?',tekst:'En gammel fortælling der prøver at forklare verden. Myter er ikke fakta.',tip:'Nordiske myter og bibelhistorier er myter'},
  {id:'k2',fag:'kri',klasse:'3.-4. kl.',type:'begreb',icon:'📚',titel:'Bibelen',tekst:'Den kristne hellige bog. GT og NT.',formel:'GT: jødernes skrifter\nNT: om Jesus',tip:'Evangelierne handler om Jesu liv'},
  {id:'k3',fag:'kri',klasse:'3.-4. kl.',type:'begreb',icon:'🌍',titel:'De fem store religioner',tekst:'Kristendom, Islam, Jødedom, Hinduisme og Buddhisme.',tip:'De tre første er abrahamitiske religioner'},
  {id:'k4',fag:'kri',klasse:'5.-6. kl.',type:'begreb',icon:'☪️',titel:'Islam',tekst:'Koranen = hellig bog. Moske = gudshus. De 5 søjler.',tip:'Ramadan = fastemåned'},
  {id:'k5',fag:'kri',klasse:'7.-9. kl.',type:'begreb',icon:'⚖️',titel:'Etik og moral',tekst:'Etik = hvad er rigtigt/forkert. Pligtetik vs. konsekvensetik.',tip:'Den gyldne regel: Behandl andre som du selv vil behandles'},
  {id:'n1',fag:'nat',klasse:'1.-2. kl.',type:'regel',icon:'🌱',titel:'Levende og ikke-levende',tekst:'Levende: vokser, spiser, ånder, formerer sig.',tip:'Blomst = levende. Sten = ikke levende'},
  {id:'n2',fag:'nat',klasse:'3.-4. kl.',type:'begreb',icon:'🔗',titel:'Fødekæden',tekst:'Viser hvem der spiser hvem. Starter altid med planter.',formel:'Sol → Plante → Mus → Ræv → Ørn',tip:'Producent = plante. Konsument = dyr'},
  {id:'n3',fag:'nat',klasse:'3.-4. kl.',type:'begreb',icon:'💧',titel:'Vandets kredsløb',tekst:'Vand fordamper, stiger op, falder som nedbør og løber tilbage.',formel:'Fordampning → Kondensation → Nedbør',tip:'Vand skifter form men forsvinder aldrig'},
  {id:'n4',fag:'nat',klasse:'3.-4. kl.',type:'begreb',icon:'🫀',titel:'Hjertets funktion',tekst:'Hjertet pumper blod rundt. Blodet bærer ilt og næring.',formel:'Hjerte → lunger → hjerte → kroppen',tip:'Mærk dit hjerteslag med hånden'},
  {id:'n5',fag:'nat',klasse:'5.-6. kl.',type:'begreb',icon:'🔬',titel:'Celler',tekst:'Alt levende er bygget af celler. Planteceller har cellevæg og kloroplaster.',formel:'Cellekerne = styrer\nMitokondrie = energi\nKloroplast = fotosyntese',tip:'Menneskekroppen har ca. 37 billioner celler'},
  {id:'n6',fag:'nat',klasse:'5.-6. kl.',type:'formel',icon:'☀️',titel:'Fotosyntese',tekst:'Planter bruger sollys, vand og CO₂ til at lave sukker og ilt.',formel:'CO₂ + H₂O + lys → sukker + O₂',tip:'Sker i kloroplasterne'},
  {id:'n7',fag:'nat',klasse:'3.-4. kl.',type:'begreb',icon:'🌍',titel:'Jordens bevægelse',tekst:'Rotation = dag og nat (24 timer). Revolution = et år (365 dage).',formel:'Rotation: 24 timer\nRevolution: 365 dage',tip:'Jordens hældning giver årstiderne'},
  {id:'n8',fag:'nat',klasse:'7.-9. kl.',type:'formel',icon:'⚡',titel:'Newtons 2. lov',tekst:'Kraft = masse × acceleration.',formel:'F = m × a',tip:'Eks: 5 kg × 10 m/s² = 50 N'},
  {id:'n9',fag:'nat',klasse:'5.-6. kl.',type:'begreb',icon:'⭐',titel:'Solsystemet',tekst:'8 planeter fra Solen: Merkur, Venus, Jord, Mars, Jupiter, Saturn, Uranus, Neptun.',tip:'"Men Vi Jordiske Mennesker Jager Slet Ukendte Nationer"'},
  {id:'i1',fag:'idr',klasse:'1.-2. kl.',type:'regel',icon:'🤝',titel:'Fair play',tekst:'Spil ordentligt og respektér hinanden og reglerne.',tip:'Det er ikke sjovt at vinde ved at snyde'},
  {id:'i2',fag:'idr',klasse:'3.-4. kl.',type:'regel',icon:'🏃',titel:'Opvarmning',tekst:'Opvarmning forbereder kroppen og forebygger skader.',formel:'5-10 min. let løb + dynamiske øvelser',tip:'Aldrig springe opvarmning over'},
  {id:'i3',fag:'idr',klasse:'3.-4. kl.',type:'begreb',icon:'❤️',titel:'Puls og kondition',tekst:'Pulsen er hjerteslagene per minut.',formel:'Maxpuls ≈ 220 − din alder',tip:'Hvilepuls for børn: ca. 70-100 slag/min.'},
  {id:'i4',fag:'idr',klasse:'5.-6. kl.',type:'regel',icon:'🤾',titel:'Håndboldregler',tekst:'3 sekunders regel, 3 skridt. Kun målvogter i eget felt (6 m).',tip:'Spilletid: 2×30 min. i senior'},
  {id:'i5',fag:'idr',klasse:'7.-9. kl.',type:'begreb',icon:'🏋️',titel:'Aerob og anaerob træning',tekst:'Aerob: med ilt, lang tid. Anaerob: uden ilt, kort og intensiv.',formel:'Aerob: løb\nAnaerob: sprint',tip:'Aerob = fedtforbrænding'}
];

var custom = [], videoLinks = {}, favoritter = [], openCards = [];
var editId = null, aktivFag = 'alle', aktivKl = 'Alle', aktivNav = 'regler', soegQ = '';
var quizData = [], quizIdx = 0, quizScore = 0, quizSvaret = false;

function gf(id) { return FAGER.find(function(f){return f.id===id;})||FAGER[0]; }

function gem() {
  try {
    localStorage.setItem('hd-custom', JSON.stringify(custom));
    localStorage.setItem('hd-videos', JSON.stringify(videoLinks));
    localStorage.setItem('hd-favs', JSON.stringify(favoritter));
  } catch(e) {}
}

function load() {
  try { var c=localStorage.getItem('hd-custom'); if(c) custom=JSON.parse(c); } catch(e) {}
  try { var v=localStorage.getItem('hd-videos'); if(v) videoLinks=JSON.parse(v); } catch(e) {}
  try { var f=localStorage.getItem('hd-favs'); if(f) favoritter=JSON.parse(f); } catch(e) {}
}

function allData() { return DATA.concat(custom); }

function rb(s) {
  return (s||'').replace(/\b(\d+)\/([1-9]\d*)\b/g, function(_, t, n) {
    return '<span class="brok"><span class="bt">'+t+'</span><span class="bn">'+n+'</span></span>';
  });
}

function setNav(n) {
  aktivNav = n;
  var nts = document.querySelectorAll('.nt');
  var pages = ['regler','favoritter','quiz'];
  nts.forEach(function(el,i){ el.classList.toggle('active', pages[i]===n); });
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('p-'+n).classList.add('active');
  document.getElementById('filter-bar').style.display = n==='quiz' ? 'none' : 'block';
  render();
}

function render() {
  soegQ = document.getElementById('search').value.toLowerCase();
  // Fag tabs
  document.getElementById('fag-bar').innerHTML = FAGER.map(function(f) {
    var isActive = aktivFag===f.id;
    return '<button class="ft'+(isActive?' active':'')+'" style="'+(isActive?'background:'+f.bg+';color:'+f.c+';border-color:'+f.c:'')+'" onclick="aktivFag=\''+f.id+'\';render()">'+f.e+' '+f.label+'</button>';
  }).join('');
  // Kl tabs
  document.getElementById('kl-bar').innerHTML = KL.map(function(k) {
    return '<button class="kt'+(aktivKl===k?' active':'')+'" onclick="aktivKl=\''+k+'\';render()">'+k+'</button>';
  }).join('');

  if (aktivNav==='regler') renderRegler();
  else if (aktivNav==='favoritter') renderFav();
  else if (aktivNav==='quiz' && !quizData.length) renderQuizStart();
}

function filtrer() {
  return allData().filter(function(d) {
    if (aktivFag!=='alle' && d.fag!==aktivFag) return false;
    if (aktivKl!=='Alle' && d.klasse!==aktivKl) return false;
    if (soegQ && d.titel.toLowerCase().indexOf(soegQ)<0 && (d.tekst||'').toLowerCase().indexOf(soegQ)<0) return false;
    return true;
  });
}

function renderRegler() {
  var data = filtrer();
  if (!data.length) { document.getElementById('o-regler').innerHTML='<div class="no-res">🔍 Ingen resultater</div>'; return; }
  var g = {regel:[],formel:[],begreb:[]};
  data.forEach(function(d){ (g[d.type]||g.begreb).push(d); });
  var lbl = {regel:'📋 Regler',formel:'🧮 Formler',begreb:'💡 Begreber'};
  document.getElementById('o-regler').innerHTML = ['regel','formel','begreb'].filter(function(t){return g[t].length;}).map(function(t) {
    return '<div class="sh">'+lbl[t]+'</div><div class="cards">'+g[t].map(kort).join('')+'</div>';
  }).join('');
}

function renderFav() {
  var favs = allData().filter(function(d){ return favoritter.indexOf(d.id)>=0; });
  document.getElementById('o-fav').innerHTML = favs.length
    ? '<div class="cards">'+favs.map(kort).join('')+'</div>'
    : '<div class="no-res">⭐ Ingen favoritter endnu</div>';
}

function kort(d) {
  var f = gf(d.fag);
  var isOpen = openCards.indexOf(d.id)>=0;
  var isFav = favoritter.indexOf(d.id)>=0;
  var isCustom = custom.find(function(c){return c.id===d.id;});
  var ytId = videoLinks[d.id];
  var html = '<div class="card'+(isOpen?' open':'')+(isFav?' fav':'')+'" onclick="togCard(\''+d.id+'\')">';
  html += '<div class="ctop">';
  html += '<div class="ci" style="background:'+f.bg+';color:'+f.c+'">'+(d.icon||'📌')+'</div>';
  html += '<div class="ch"><div class="ctit">'+d.titel+'</div><div class="cmet">'+d.klasse+' · '+d.type+(isFav?' · ⭐':'')+(ytId?' · 📺':'')+'</div></div>';
  html += '<div class="carr">▼</div>';
  html += '</div>';
  html += '<div class="cbody">';
  html += '<div class="ctekst">'+rb(d.tekst||'').replace(/\n/g,'<br>')+'</div>';
  if (d.formel) html += '<div class="cformel">'+rb(d.formel).replace(/\n/g,'<br>')+'</div>';
  if (d.tip) html += '<div class="ctip">💡 '+d.tip+'</div>';
  if (ytId) html += '<div class="vw"><iframe src="https://www.youtube.com/embed/'+ytId+'" allowfullscreen></iframe></div>';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:.5rem;flex-wrap:wrap;gap:5px">';
  html += '<span class="cbadge" style="background:'+f.bg+';color:'+f.c+'">'+f.e+' '+f.label+'</span>';
  html += '<div style="display:flex;gap:5px">';
  html += '<button class="cact'+(isFav?' on':'')+'" onclick="togFav(\''+d.id+'\',event)">'+(isFav?'⭐':'☆')+' Favorit</button>';
  if (ytId) html += '<button class="cact" onclick="fjernVideo(\''+d.id+'\',event)">🗑 Video</button>';
  else html += '<button class="cact" onclick="tilfoejVideo(\''+d.id+'\',event)">📺 Video</button>';
  if (isCustom) html += '<button class="cact" onclick="event.stopPropagation();openEdit(\''+d.id+'\')">✏️</button>';
  html += '</div></div></div></div>';
  return html;
}

function togCard(id) {
  var i = openCards.indexOf(id);
  if (i>=0) openCards.splice(i,1); else openCards.push(id);
  render();
}
function togFav(id,e) {
  e.stopPropagation();
  var i = favoritter.indexOf(id);
  if (i>=0) favoritter.splice(i,1); else favoritter.push(id);
  gem(); render();
}
function tilfoejVideo(id,e) {
  e.stopPropagation();
  var url = prompt('Indsæt YouTube-link:');
  if (!url) return;
  var m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/);
  if (!m) { alert('Ikke et gyldigt YouTube-link'); return; }
  videoLinks[id] = m[1]; gem(); render();
}
function fjernVideo(id,e) { e.stopPropagation(); delete videoLinks[id]; gem(); render(); }

function renderQuizStart() {
  document.getElementById('o-quiz').innerHTML = '<div class="qcard"><div style="font-size:48px;margin-bottom:.75rem">🧠</div><div style="font-family:DM Serif Display,serif;font-size:24px;margin-bottom:.5rem">Quiz dig selv!</div><div style="font-size:14px;color:var(--muted);margin-bottom:1.5rem">Test om du husker reglerne</div><div style="margin-bottom:1rem"><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">Vælg fag</label><select id="q-fag" style="width:100%;padding:9px 12px;font-size:14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:DM Sans,sans-serif"><option value="alle">Alle fag</option>'+FAGER.slice(1).map(function(f){return'<option value="'+f.id+'">'+f.e+' '+f.label+'</option>';}).join('')+'</select></div><div style="margin-bottom:1.5rem"><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">Klassetrin</label><select id="q-kl" style="width:100%;padding:9px 12px;font-size:14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:DM Sans,sans-serif">'+KL.map(function(k){return'<option>'+k+'</option>';}).join('')+'</select></div><button class="btn btn-p" style="width:100%" onclick="startQuiz()">Start quiz →</button></div>';
}

function startQuiz() {
  var fag = document.getElementById('q-fag').value;
  var kl = document.getElementById('q-kl').value;
  var pool = allData().filter(function(d){
    if (fag!=='alle' && d.fag!==fag) return false;
    if (kl!=='Alle' && d.klasse!==kl) return false;
    return d.tekst && d.titel;
  });
  if (pool.length<3) { alert('Ikke nok kort — vælg flere fag'); return; }
  quizData = pool.sort(function(){return Math.random()-.5;}).slice(0,10);
  quizIdx=0; quizScore=0;
  visQuizSpm();
}

function visQuizSpm() {
  if (quizIdx>=quizData.length) { visQuizSlut(); return; }
  var k = quizData[quizIdx];
  var f = gf(k.fag);
  quizSvaret = false;
  var rigtig = k.titel;
  var pool2 = allData().filter(function(d){return d.id!==k.id && d.titel!==rigtig && d.fag===k.fag;});
  if (pool2.length<3) pool2 = allData().filter(function(d){return d.id!==k.id && d.titel!==rigtig;});
  var andre = pool2.sort(function(){return Math.random()-.5;}).slice(0,3).map(function(d){return d.titel;});
  var opts = [rigtig].concat(andre).sort(function(){return Math.random()-.5;});
  document.getElementById('o-quiz').innerHTML = '<div class="qcard"><div style="font-size:12px;color:var(--muted);margin-bottom:.5rem">Spørgsmål '+(quizIdx+1)+' af '+quizData.length+'</div><div style="background:'+f.bg+';color:'+f.c+';display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11px;margin-bottom:.75rem">'+f.e+' '+f.label+' · '+k.klasse+'</div><div style="font-size:13px;color:var(--muted);margin-bottom:.5rem">Hvad hedder denne regel?</div><div style="background:var(--s2);border-radius:10px;padding:1rem;margin-bottom:1.25rem;font-size:14px;line-height:1.6;text-align:left">'+(k.tekst||'').substring(0,150)+(k.formel?'<div style="font-family:monospace;font-size:13px;margin-top:.5rem;color:var(--accent)">'+k.formel.split('\n')[0]+'</div>':'')+'</div>'+opts.map(function(o){return'<button class="qopt" onclick="svarQuiz(\''+o.replace(/'/g,"\\'")+'\'  ,\''+rigtig.replace(/'/g,"\\'")+'\',this)">'+o+'</button>';}).join('')+'<div id="q-fb" style="min-height:36px"></div></div>';
}

function svarQuiz(svar,rigtig,el) {
  if (quizSvaret) return;
  quizSvaret = true;
  var ok = svar===rigtig;
  if (ok) quizScore++;
  document.querySelectorAll('.qopt').forEach(function(b){
    b.onclick=null;
    if (b.textContent===rigtig) b.classList.add('ok');
    else if (b===el && !ok) b.classList.add('fej');
  });
  document.getElementById('q-fb').innerHTML='<div style="margin-top:.5rem;font-size:14px;color:'+(ok?'#059669':'#DC2626')+'">'+(ok?'✓ Rigtigt!':'✗ Forkert — det var: '+rigtig)+'</div>';
  setTimeout(function(){quizIdx++;visQuizSpm();},1500);
}

function visQuizSlut() {
  var pct = Math.round(quizScore/quizData.length*100);
  var e = pct>=80?'🎉':pct>=50?'👍':'💪';
  document.getElementById('o-quiz').innerHTML='<div class="qcard"><div style="font-size:56px;margin-bottom:.5rem">'+e+'</div><div style="font-family:DM Serif Display,serif;font-size:24px">'+(pct>=80?'Fremragende!':pct>=50?'Godt klaret!':'Øv lidt mere!')+'</div><div style="font-family:DM Serif Display,serif;font-size:48px;margin:.5rem 0">'+quizScore+'/'+quizData.length+'</div><div style="font-size:14px;color:var(--muted);margin-bottom:1.5rem">'+pct+'% korrekte</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn btn-p" onclick="quizData=[];renderQuizStart()">Ny quiz</button><button class="btn btn-g" onclick="quizIdx=0;quizScore=0;visQuizSpm()">Prøv igen</button></div></div>';
}

function openModal() {
  editId=null;
  document.getElementById('m-titel').textContent='Tilføj regel';
  document.getElementById('btn-del').style.display='none';
  ['f-titel','f-icon','f-tekst','f-formel','f-tip'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f-icon').value='📌';
  document.getElementById('mbg').classList.add('open');
  setTimeout(function(){document.getElementById('f-titel').focus();},200);
}
function openEdit(id) {
  var d=custom.find(function(c){return c.id===id;}); if(!d) return;
  editId=id;
  document.getElementById('m-titel').textContent='Rediger';
  document.getElementById('btn-del').style.display='inline-flex';
  document.getElementById('f-fag').value=d.fag;
  document.getElementById('f-kl').value=d.klasse;
  document.getElementById('f-type').value=d.type;
  document.getElementById('f-titel').value=d.titel;
  document.getElementById('f-icon').value=d.icon||'📌';
  document.getElementById('f-tekst').value=d.tekst||'';
  document.getElementById('f-formel').value=d.formel||'';
  document.getElementById('f-tip').value=d.tip||'';
  document.getElementById('mbg').classList.add('open');
}
function lukkModal(){document.getElementById('mbg').classList.remove('open');}
function gemKort() {
  var titel=document.getElementById('f-titel').value.trim();
  if(!titel){document.getElementById('f-titel').focus();return;}
  var obj={id:editId||'c-'+Date.now(),fag:document.getElementById('f-fag').value,klasse:document.getElementById('f-kl').value,type:document.getElementById('f-type').value,titel:titel,icon:document.getElementById('f-icon').value||'📌',tekst:document.getElementById('f-tekst').value,formel:document.getElementById('f-formel').value,tip:document.getElementById('f-tip').value};
  if(editId) custom=custom.map(function(c){return c.id===editId?obj:c;}); else custom.push(obj);
  gem(); lukkModal(); render();
}
function delKort() {
  if(!confirm('Slet?')) return;
  custom=custom.filter(function(c){return c.id!==editId;});
  gem(); lukkModal(); render();
}

document.addEventListener('keydown',function(e){if(e.key==='Escape')lukkModal();});
load();
render();
</script>
</body>
</html>
